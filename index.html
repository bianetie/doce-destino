<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Doce Destino</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
  background:#f8edf3;
}

body{
  position:fixed;
  inset:0;
}

/* =========================
   CENÁRIO
========================= */

#game{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100vh;
  overflow:hidden;
}

.scene{
  position:absolute;
  inset:0;
  z-index:0;
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
}

#cafe{
  background-image:url("cafe-aurora-manha.png");
}

#university{
  background-image:url("universidade-aurora.png.PNG");
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  z-index:30;

  display:flex;
  justify-content:space-between;
  align-items:center;

  pointer-events:none;
}

.player-info,
.affinity{
  padding:7px 12px;

  background:rgba(255,248,252,.88);
  border:1px solid rgba(180,130,155,.35);
  border-radius:18px;

  color:#67495a;
  font-size:13px;

  box-shadow:0 3px 12px rgba(80,40,60,.10);
}

.affinity{
  color:#8b536f;
}

/* =========================
   CHILDE
========================= */

#childe{
  position:absolute;
  inset:0;

  z-index:10;

  pointer-events:none;
  overflow:hidden;
}

#childe img{
  position:absolute;

  height:102vh;
  width:auto;
  max-width:none;

  right:-3vw;
  bottom:-6vh;

  object-fit:contain;
  object-position:center bottom;

  filter:drop-shadow(0 8px 18px rgba(40,20,30,.18));

  animation:childeAlive 4.5s ease-in-out infinite;
  transform-origin:center bottom;
}

@keyframes childeAlive{

  0%,100%{
    transform:translateY(0) rotate(0deg);
  }

  50%{
    transform:translateY(-5px) rotate(.25deg);
  }

}

/* =========================
   BALÃO DO CHILDE
========================= */

#speech{
  position:absolute;

  left:5%;
  top:9%;

  width:min(46%,360px);

  z-index:20;

  padding:14px 17px;

  background:rgba(255,249,253,.96);

  border:1px solid rgba(176,126,153,.45);
  border-radius:20px 20px 20px 7px;

  box-shadow:
    0 5px 18px rgba(65,35,50,.14),
    0 0 12px rgba(255,255,255,.55);

  color:#513d48;

  font-size:14px;
  line-height:1.45;
}

#speech::after{
  content:"";

  position:absolute;
  bottom:-9px;
  left:18px;

  width:17px;
  height:17px;

  background:rgba(255,249,253,.96);

  border-left:1px solid rgba(176,126,153,.35);
  border-bottom:1px solid rgba(176,126,153,.35);

  transform:rotate(-45deg);
}

#speech-name{
  margin-bottom:4px;

  color:#8d5572;

  font-weight:bold;
  font-size:13px;
}

/* =========================
   CAIXA DE DIÁLOGO
========================= */

#dialogue{
  position:absolute;

  left:5%;
  right:5%;
  bottom:15px;

  z-index:25;

  min-height:105px;

  padding:17px 18px 15px;

  background:rgba(255,248,252,.94);

  border:1px solid rgba(177,128,154,.42);
  border-radius:18px;

  box-shadow:
    0 6px 20px rgba(55,25,45,.15),
    inset 0 0 20px rgba(255,255,255,.5);

  color:#493843;

  cursor:pointer;
}

#speaker{
  margin-bottom:5px;

  color:#8d5572;

  font-size:13px;
  font-weight:bold;
}

#text{
  font-size:15px;
  line-height:1.45;
  padding-right:72px;
}

#continue{
  position:absolute;

  right:15px;
  bottom:12px;

  color:#a26986;

  font-size:12px;
  letter-spacing:.2px;

  animation:softPulse 1.8s ease-in-out infinite;
}

@keyframes softPulse{
  0%,100%{
    opacity:.55;
  }

  50%{
    opacity:1;
  }
}

/* =========================
   PENSAMENTOS
========================= */

#thought{
  position:absolute;

  left:8%;
  right:8%;
  top:42%;

  z-index:22;

  display:none;

  text-align:center;

  color:#705363;

  font-size:16px;
  font-style:italic;

  text-shadow:
    0 1px 4px rgba(255,255,255,.9);
}

/* =========================
   ESCOLHAS
========================= */

#choices{
  position:absolute;

  left:5%;
  right:5%;
  bottom:135px;

  z-index:40;

  display:none;

  flex-direction:column;
  gap:9px;
}

.choice{
  width:100%;

  padding:12px 15px;

  background:rgba(255,248,252,.95);

  border:1px solid rgba(179,130,155,.48);
  border-radius:16px;

  color:#684b5b;

  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;

  box-shadow:0 4px 14px rgba(60,30,45,.12);

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}

.choice:active{
  transform:scale(.98);
  background:#fff1f7;
}

/* =========================
   TRANSIÇÃO
========================= */

.fade{
  animation:fadeScene .5s ease;
}

@keyframes fadeScene{
  from{
    opacity:.3;
  }

  to{
    opacity:1;
  }
}

/* =========================
   CELULAR
========================= */

@media(max-width:700px){

  #hud{
    top:10px;
    left:10px;
    right:10px;
  }

  .player-info,
  .affinity{
    padding:6px 10px;
    font-size:12px;
  }

  #childe img{
    height:102vh;
    right:-3vw;
    bottom:-6vh;
  }

  #speech{
    left:4%;
    top:8%;

    width:47%;

    padding:12px 13px;

    font-size:12px;
  }

  #speech-name{
    font-size:12px;
  }

  #dialogue{
    left:3%;
    right:3%;
    bottom:10px;

    min-height:98px;

    padding:14px 15px 13px;

    border-radius:16px;
  }

  #speaker{
    font-size:12px;
  }

  #text{
    font-size:14px;
    line-height:1.4;
    padding-right:60px;
  }

  #continue{
    right:12px;
    bottom:10px;
    font-size:11px;
  }

  #choices{
    left:4%;
    right:4%;
    bottom:120px;
    gap:7px;
  }

  .choice{
    padding:11px 12px;
    font-size:13px;
  }

}

/* =========================
   TELAS MUITO BAIXAS
========================= */

@media(max-height:700px){

  #childe img{
    height:102vh;
    right:-3vw;
    bottom:-6vh;
  }

  #speech{
    top:7%;
  }

  #dialogue{
    min-height:90px;
  }

  #text{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- CENÁRIOS -->
  <div id="cafe" class="scene"></div>
  <div id="university" class="scene" style="display:none;"></div>

  <!-- HUD -->
  <div id="hud">

    <div class="player-info">
      Você
    </div>

    <div class="affinity">
      ♡ Afinidade <span id="affinityValue">0</span>
    </div>

  </div>

  <!-- CHILDE -->
  <div id="childe">

    <img
      id="childeSprite"
      src="childe-alegre-transparente.png.PNG"
      alt="Childe"
    >

  </div>

  <!-- BALÃO -->
  <div id="speech">

    <div id="speech-name">
      ???
    </div>

    <div id="speech-text">
      Aurora? É um pouco difícil de achar daqui.
    </div>

  </div>

  <!-- PENSAMENTO -->
  <div id="thought"></div>

  <!-- ESCOLHAS -->
  <div id="choices"></div>

  <!-- DIÁLOGO -->
  <div id="dialogue">

    <div id="speaker">
      Narrador
    </div>

    <div id="text">
      O caminho até a Universidade Aurora parecia mais longo do que eu imaginava...
    </div>

    <div id="continue">
      Continuar ›
    </div>

  </div>

</div>

<script>

/* =====================================
   ESTADO DO JOGO
===================================== */

let affinity = 0;

let currentScene = "cafe";

let childeMet = false;

let memory = {
  helpedChilde:false,
  ignoredChilde:false,
  wasKind:false,
  wasCold:false
};


/* =====================================
   ELEMENTOS
===================================== */

const cafe = document.getElementById("cafe");
const university = document.getElementById("university");

const childe = document.getElementById("childe");
const childeSprite = document.getElementById("childeSprite");

const speech = document.getElementById("speech");
const speechName = document.getElementById("speech-name");
const speechText = document.getElementById("speech-text");

const dialogue = document.getElementById("dialogue");
const speaker = document.getElementById("speaker");
const text = document.getElementById("text");

const thought = document.getElementById("thought");
const choices = document.getElementById("choices");

const affinityValue = document.getElementById("affinityValue");


/* =====================================
   FUNÇÕES
===================================== */

function updateAffinity(){

  affinityValue.textContent = affinity;

}


function setScene(scene){

  currentScene = scene;

  cafe.style.display =
    scene === "cafe" ? "block" : "none";

  university.style.display =
    scene === "university" ? "block" : "none";

}


function setChilde(expression){

  if(expression === "alegre"){

    childeSprite.src =
      "childe-alegre-transparente.png.PNG";

  }

  if(expression === "franzindo"){

    childeSprite.src =
      "childe-Franzindo a testa-transparente.png.PNG";

  }

}


function showChilde(){

  childe.style.display = "block";

}


function hideChilde(){

  childe.style.display = "none";

}


function showSpeech(name,message){

  speechName.textContent = name;
  speechText.textContent = message;

  speech.style.display = "block";

}


function hideSpeech(){

  speech.style.display = "none";

}


function showThought(message){

  thought.textContent = message;
  thought.style.display = "block";

}


function hideThought(){

  thought.style.display = "none";

}


function showDialogue(name,message){

  speaker.textContent = name;
  text.textContent = message;

}


function hideChoices(){

  choices.style.display = "none";
  choices.innerHTML = "";

}


function showChoices(options){

  choices.innerHTML = "";

  options.forEach(option => {

    const button = document.createElement("button");

    button.className = "choice";

    button.textContent = option.text;

    button.addEventListener("click", () => {

      hideChoices();

      option.action();

    });

    choices.appendChild(button);

  });

  choices.style.display = "flex";

}


function next(){

  if(step === 0){

    step = 1;

    showDialogue(
      "Narrador",
      "Eu respirei fundo. Primeiro dia na Universidade Aurora."
    );

    return;
  }


  if(step === 1){

    step = 2;

    showThought(
      "Ah... o que eu vou fazer agora? Por onde eu começo?"
    );

    showDialogue(
      "Você",
      ""
    );

    return;
  }


  if(step === 2){

    step = 3;

    hideThought();

    showChilde();

    setChilde("alegre");

    showSpeech(
      "???",
      "Aurora? É um pouco difícil de achar daqui."
    );

    showDialogue(
      "Você",
      "Hm?"
    );

    return;
  }


  if(step === 3){

    step = 4;

    showSpeech(
      "???",
      "Você também está tentando encontrar a universidade?"
    );

    showDialogue(
      "Você",
      "Estou. É meu primeiro dia."
    );

    return;
  }


  if(step === 4){

    step = 5;

    showSpeech(
      "???",
      "Então estamos no mesmo barco."
    );

    showDialogue(
      "Você",
      "Parece que sim..."
    );

    return;
  }


  if(step === 5){

    showDialogue(
      "Narrador",
      "Ele sorriu de leve, como se já estivesse acostumado a esconder o que realmente pensava."
    );

    step = 6;

    return;
  }


  if(step === 6){

    showDialogue(
      "Você",
      "Você sabe onde fica a entrada?"
    );

    step = 7;

    return;
  }


  if(step === 7){

    showSpeech(
      "???",
      "Sei mais ou menos. Podemos procurar juntos."
    );

    showDialogue(
      "Você",
      "Juntos?"
    );

    step = 8;

    return;
  }


  if(step === 8){

    setChilde("franzindo");

    showDialogue(
      "Narrador",
      "Por algum motivo, ele pareceu observar minha reação antes de continuar."
    );

    step = 9;

    return;
  }


  if(step === 9){

    showChoices([

      {
        text:"“Claro. Vamos juntos.”",

        action:() => {

          affinity += 2;

          memory.helpedChilde = true;
          memory.wasKind = true;

          updateAffinity();

          setChilde("alegre");

          showSpeech(
            "Childe",
            "Ótimo. Então não precisa ficar perdida sozinha."
          );

          showDialogue(
            "Você",
            "Obrigada."
          );

          step = 10;
        }
      },

      {
        text:"“Acho que consigo me virar sozinha.”",

        action:() => {

          affinity -= 1;

          memory.ignoredChilde = true;
          memory.wasCold = true;

          updateAffinity();

          setChilde("franzindo");

          showSpeech(
            "Childe",
            "Tudo bem... como quiser."
          );

          showDialogue(
            "Narrador",
            "Por alguns segundos, o silêncio entre nós pareceu estranho."
          );

          step = 10;
        }
      }

    ]);

  }


  if(step === 10){

    setScene("university");

    hideSpeech();

    showChilde();

    setChilde(
      memory.wasKind
      ? "alegre"
      : "franzindo"
    );

    showDialogue(
      "Narrador",
      "Alguns minutos depois, finalmente chegamos à Universidade Aurora."
    );

    step = 11;

    return;
  }


  if(step === 11){

    showSpeech(
      "Childe",
      memory.wasKind
      ? "Então... acho que a gente se vê por aí."
      : "Bem... acho que daqui você consegue."
    );

    showDialogue(
      "Você",
      "Até mais."
    );

    step = 12;

    return;
  }


  if(step === 12){

    hideChilde();
    hideSpeech();

    showDialogue(
      "Narrador",
      "Ele se afastou pela entrada da universidade."
    );

    step = 13;

    return;
  }


  if(step === 13){

    showThought(
      "Eu ainda nem comecei as aulas... e já aconteceu tudo isso."
    );

    showDialogue(
      "Você",
      ""
    );

    step = 14;

    return;
  }


  if(step === 14){

    hideThought();

    showDialogue(
      "Narrador",
      "Sem saber, aquele encontro seria apenas o começo."
    );

    step = 15;

    return;
  }


  if(step === 15){

    showDialogue(
      "Narrador",
      "Fim do prólogo."
    );

    return;
  }

}


/* =====================================
   CONTROLE DO DIÁLOGO
===================================== */

let step = 0;

dialogue.addEventListener("click", () => {

  /*
    Se houver escolhas abertas,
    não avança o diálogo.
  */

  if(choices.style.display === "flex"){
    return;
  }

  next();

});


/* =====================================
   INÍCIO
===================================== */

setScene("cafe");

showChilde();

setChilde("alegre");

showSpeech(
  "???",
  "Aurora? É um pouco difícil de achar daqui."
);

showDialogue(
  "Narrador",
  "O caminho até a Universidade Aurora parecia mais longo do que eu imaginava..."
);

updateAffinity();

</script>

</body>
</html>
