<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">
<title>Doce Destino</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    background:#f8edf5;
}

body{
    color:#4b3948;
}

/* =========================
   TELA INICIAL
========================= */

.start-screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at 50% 35%,
        rgba(255,255,255,.95),
        rgba(249,232,244,.96) 55%,
        rgba(235,211,230,.98));
    z-index:20;
}

.start-content{
    width:88%;
    max-width:420px;
}

.logo{
    font-size:42px;
    font-weight:500;
    letter-spacing:2px;
    color:#79536d;
    margin-bottom:8px;
}

.subtitle{
    font-size:14px;
    letter-spacing:1px;
    color:#9b718d;
    margin-bottom:45px;
}

.start-decoration{
    font-size:30px;
    color:#c79ab8;
    margin-bottom:18px;
}

.start-button{
    border:1px solid rgba(159,111,143,.55);
    background:rgba(255,255,255,.62);
    color:#76516a;
    padding:13px 34px;
    border-radius:30px;
    font-family:inherit;
    font-size:15px;
    letter-spacing:.5px;
    box-shadow:0 5px 18px rgba(126,76,110,.12);
    cursor:pointer;
    transition:.25s;
}

.start-button:active{
    transform:scale(.97);
}

/* =========================
   HISTÓRIA
========================= */

.story-screen{
    position:fixed;
    inset:0;
    display:none;
    overflow:hidden;
    background:#dce9e4;
}

.scene{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.scene img{
    width:115%;
    height:115%;
    object-fit:cover;
    position:absolute;
    left:-7.5%;
    top:-7.5%;
    animation:auroraCamera 18s ease-in-out infinite alternate;
}

@keyframes auroraCamera{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.06) translate(-1%,-.7%);
    }
}

/* =========================
   VENTO / FOLHAS
========================= */

.wind-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.leaf{
    position:absolute;
    width:9px;
    height:5px;
    border-radius:100% 0 100% 0;
    background:rgba(255,244,250,.7);
    animation:windLeaf linear infinite;
}

.leaf:nth-child(1){
    left:5%;
    top:20%;
    animation-duration:8s;
}

.leaf:nth-child(2){
    left:32%;
    top:8%;
    animation-duration:10s;
    animation-delay:2s;
}

.leaf:nth-child(3){
    left:65%;
    top:18%;
    animation-duration:7s;
    animation-delay:1s;
}

.leaf:nth-child(4){
    left:85%;
    top:28%;
    animation-duration:11s;
    animation-delay:3s;
}

@keyframes windLeaf{
    0%{
        transform:translate(-20px,-20px) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    100%{
        transform:translate(150px,90vh) rotate(360deg);
        opacity:0;
    }
}

/* =========================
   ÁGUA
========================= */

.water-effect{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:28%;
    pointer-events:none;
    overflow:hidden;
    opacity:.45;
}

.ripple{
    position:absolute;
    width:160px;
    height:40px;
    border:1px solid rgba(255,255,255,.55);
    border-radius:50%;
    animation:rippleWater 4s ease-out infinite;
}

.ripple:nth-child(1){
    left:20%;
    bottom:28%;
}

.ripple:nth-child(2){
    left:58%;
    bottom:17%;
    animation-delay:1.8s;
}

@keyframes rippleWater{
    0%{
        transform:scale(.3);
        opacity:0;
    }

    25%{
        opacity:.8;
    }

    100%{
        transform:scale(1.8);
        opacity:0;
    }
}

.water-shimmer{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            105deg,
            transparent 30%,
            rgba(255,255,255,.15) 45%,
            transparent 60%
        );
    animation:waterShimmer 5s linear infinite;
}

@keyframes waterShimmer{
    from{
        transform:translateX(-100%);
    }
    to{
        transform:translateX(100%);
    }
}

/* =========================
   HUD
========================= */

.hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
}

.player-card{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 11px 6px 7px;
    border:1px solid rgba(255,255,255,.65);
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(8px);
    border-radius:30px;
    box-shadow:0 3px 14px rgba(80,50,70,.1);
}

.player-avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,.8);
    border:1px solid rgba(160,120,145,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a47792;
    font-size:17px;
}

.player-name{
    font-size:13px;
    color:#684d60;
}

.affinity{
    padding:7px 11px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.65);
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(8px);
    color:#76516a;
    font-size:12px;
}

/* =========================
   SOM
========================= */

.sound-button{
    position:absolute;
    right:15px;
    top:61px;
    z-index:8;
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.58);
    color:#76516a;
    font-size:16px;
    box-shadow:0 3px 14px rgba(80,50,70,.1);
}

.audio-panel{
    display:none;
    position:absolute;
    right:15px;
    top:105px;
    z-index:9;
    width:205px;
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.7);
    background:rgba(255,248,252,.9);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(80,50,70,.16);
}

.audio-row{
    margin-bottom:12px;
}

.audio-row:last-child{
    margin-bottom:0;
}

.audio-row label{
    display:block;
    font-size:11px;
    color:#76516a;
    margin-bottom:5px;
}

.audio-row input{
    width:100%;
}

.mute-button{
    border:1px solid rgba(150,105,135,.35);
    background:rgba(255,255,255,.55);
    color:#76516a;
    border-radius:15px;
    padding:6px 12px;
    font-family:inherit;
    font-size:11px;
}

/* =========================
   ÁREA DE DIÁLOGO
========================= */

.bottom-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:0 12px 12px;
    z-index:6;
}

.dialogue-box{
    position:relative;
    width:100%;
    min-height:115px;
    max-height:30vh;
    padding:18px 20px 25px;
    border:1px solid rgba(255,255,255,.82);
    border-radius:20px;
    background:rgba(255,250,253,.84);
    backdrop-filter:blur(13px);
    box-shadow:
        0 7px 28px rgba(71,46,65,.18),
        inset 0 1px rgba(255,255,255,.7);
    cursor:pointer;
    touch-action:manipulation;
}

.dialogue-box:active{
    transform:scale(.997);
}

.dialogue-text{
    font-size:14px;
    line-height:1.65;
    color:#4d3c49;
    min-height:70px;
}

.tap-indicator{
    position:absolute;
    right:15px;
    bottom:8px;
    color:#a77b97;
    font-size:18px;
    animation:tapPulse 1.5s ease-in-out infinite;
}

@keyframes tapPulse{
    0%,100%{
        opacity:.35;
        transform:translateX(0);
    }
    50%{
        opacity:1;
        transform:translateX(4px);
    }
}

/* =========================
   ESCOLHAS
========================= */

.choice-area{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:9px;
}

.choice-button{
    width:100%;
    border:1px solid rgba(180,130,165,.5);
    background:rgba(255,249,253,.9);
    color:#674b5e;
    border-radius:18px;
    padding:10px 14px;
    font-family:inherit;
    font-size:13px;
    line-height:1.3;
    box-shadow:0 4px 12px rgba(85,50,75,.09);
    transition:.2s;
}

.choice-button:active{
    transform:scale(.98);
    background:rgba(249,233,244,.95);
}

/* =========================
   FINAL
========================= */

.restart-button{
    border:1px solid rgba(170,120,155,.5);
    background:rgba(255,250,253,.9);
    color:#76516a;
    border-radius:18px;
    padding:9px 20px;
    font-family:inherit;
    font-size:12px;
    margin-top:8px;
}

/* =========================
   RESPONSIVO
========================= */

@media(min-width:700px){
    .bottom-area{
        left:50%;
        transform:translateX(-50%);
        width:650px;
    }

    .hud{
        left:25px;
        right:25px;
    }

    .sound-button{
        right:25px;
    }

    .audio-panel{
        right:25px;
    }
}
</style>
</head>

<body>

<!-- =========================
     TELA INICIAL
========================= -->

<div class="start-screen" id="startScreen">

    <div class="start-content">

        <div class="start-decoration">♡</div>

        <div class="logo">
            Doce Destino
        </div>

        <div class="subtitle">
            Seu coração escolhe o caminho.
        </div>

        <button class="start-button" id="startButton">
            Começar minha história
        </button>

    </div>

</div>


<!-- =========================
     HISTÓRIA
========================= -->

<div class="story-screen" id="storyScreen">

    <div class="scene">
        <img src="universidade-aurora.png.PNG"
             alt="Universidade Aurora">
    </div>

    <div class="wind-layer">
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
    </div>

    <div class="water-effect">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="water-shimmer"></div>
    </div>


    <!-- HUD -->

    <div class="hud">

        <div class="player-card">

            <div class="player-avatar">
                ♡
            </div>

            <div class="player-name" id="playerName">
                Você
            </div>

        </div>

        <div class="affinity" id="affinity">
            ♡ Afinidade 0
        </div>

    </div>


    <!-- SOM -->

    <button class="sound-button" id="soundButton">
        ♫
    </button>

    <div class="audio-panel" id="audioPanel">

        <div class="audio-row">
            <label>
                Música
            </label>

            <input
                type="range"
                id="musicVolume"
                min="0"
                max="1"
                step=".01"
                value=".35">
        </div>

        <div class="audio-row">
            <label>
                Ambiente
            </label>

            <input
                type="range"
                id="ambientVolume"
                min="0"
                max="1"
                step=".01"
                value=".10">
        </div>

        <div class="audio-row">
            <label>
                Efeitos
            </label>

            <input
                type="range"
                id="effectVolume"
                min="0"
                max="1"
                step=".01"
                value=".35">
        </div>

        <button class="mute-button" id="muteButton">
            Silenciar
        </button>

    </div>


    <!-- DIÁLOGO -->

    <div class="bottom-area">

        <div
            class="dialogue-box"
            id="dialogueBox">

            <div
                class="dialogue-text"
                id="dialogueText">
            </div>

            <div
                class="tap-indicator"
                id="tapIndicator">
                ›
            </div>

        </div>

        <div
            class="choice-area"
            id="choiceArea">
        </div>

    </div>

</div>


<script>

/* =====================================================
   ESTADO DO JOGO
===================================================== */

const memory = {

    conversouComEstranho:false,

    observouUniversidade:false,

    entrouImediatamente:false,

    foiSozinha:false,

    perguntouNome:false,

    seguiuSozinhaDepois:false,

    affinity:0

};


/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const storyScreen =
    document.getElementById("storyScreen");

const startButton =
    document.getElementById("startButton");

const dialogueBox =
    document.getElementById("dialogueBox");

const dialogueText =
    document.getElementById("dialogueText");

const choiceArea =
    document.getElementById("choiceArea");

const tapIndicator =
    document.getElementById("tapIndicator");

const affinityDisplay =
    document.getElementById("affinity");

const soundButton =
    document.getElementById("soundButton");

const audioPanel =
    document.getElementById("audioPanel");

const muteButton =
    document.getElementById("muteButton");


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

let musicGain = null;
let ambientGain = null;
let effectGain = null;

let musicStarted = false;

let muted = false;


function initAudio(){

    if(audioContext) return;

    audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    musicGain =
        audioContext.createGain();

    ambientGain =
        audioContext.createGain();

    effectGain =
        audioContext.createGain();

    musicGain.gain.value = .35;
    ambientGain.gain.value = .10;
    effectGain.gain.value = .35;

    musicGain.connect(
        audioContext.destination
    );

    ambientGain.connect(
        audioContext.destination
    );

    effectGain.connect(
        audioContext.destination
    );

    startMusic();
    startBirds();
}


/* =====================================================
   MÚSICA ORIGINAL
===================================================== */

function startMusic(){

    if(musicStarted) return;

    musicStarted = true;

    const notes = [
        261.63,
        329.63,
        392.00,
        329.63,
        293.66,
        349.23,
        440.00,
        349.23
    ];

    let index = 0;

    function playNote(){

        if(!audioContext) return;

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type = "sine";

        osc.frequency.value =
            notes[index];

        gain.gain.setValueAtTime(
            0,
            audioContext.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            .055,
            audioContext.currentTime + .08
        );

        gain.gain.linearRampToValueAtTime(
            0,
            audioContext.currentTime + 1.4
        );

        osc.connect(gain);
        gain.connect(musicGain);

        osc.start();

        osc.stop(
            audioContext.currentTime + 1.5
        );

        index =
            (index + 1) % notes.length;

        setTimeout(
            playNote,
            1100
        );
    }

    playNote();
}


/* =====================================================
   PASSARINHOS
===================================================== */

function startBirds(){

    function bird(){

        if(!audioContext) return;

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type = "sine";

        const now =
            audioContext.currentTime;

        osc.frequency.setValueAtTime(
            1200,
            now
        );

        osc.frequency.linearRampToValueAtTime(
            1800,
            now + .12
        );

        osc.frequency.linearRampToValueAtTime(
            1300,
            now + .24
        );

        gain.gain.setValueAtTime(
            0,
            now
        );

        gain.gain.linearRampToValueAtTime(
            .025,
            now + .03
        );

        gain.gain.linearRampToValueAtTime(
            0,
            now + .27
        );

        osc.connect(gain);
        gain.connect(ambientGain);

        osc.start(now);
        osc.stop(now + .3);

        setTimeout(
            bird,
            7000 + Math.random() * 7000
        );
    }

    bird();
}


/* =====================================================
   CONTROLES DE ÁUDIO
===================================================== */

soundButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        audioPanel.style.display =
            audioPanel.style.display === "block"
            ? "none"
            : "block";
    }
);


document.getElementById("musicVolume")
.addEventListener(
    "input",
    function(){

        if(musicGain)
            musicGain.gain.value =
                muted ? 0 : this.value;
    }
);


document.getElementById("ambientVolume")
.addEventListener(
    "input",
    function(){

        if(ambientGain)
            ambientGain.gain.value =
                muted ? 0 : this.value;
    }
);


document.getElementById("effectVolume")
.addEventListener(
    "input",
    function(){

        if(effectGain)
            effectGain.gain.value =
                muted ? 0 : this.value;
    }
);


muteButton.addEventListener(
    "click",
    function(){

        muted = !muted;

        if(musicGain)
            musicGain.gain.value =
                muted
                ? 0
                : document.getElementById(
                    "musicVolume"
                  ).value;

        if(ambientGain)
            ambientGain.gain.value =
                muted
                ? 0
                : document.getElementById(
                    "ambientVolume"
                  ).value;

        if(effectGain)
            effectGain.gain.value =
                muted
                ? 0
                : document.getElementById(
                    "effectVolume"
                  ).value;

        muteButton.textContent =
            muted
            ? "Ativar som"
            : "Silenciar";
    }
);


/* =====================================================
   HISTÓRIA
===================================================== */

const story = {

    start:{

        type:"narration",

        text:
        "O portão da Universidade Aurora surge diante de você. O lugar parece ainda maior do que nas fotos.",

        next:"arrival"
    },


    arrival:{

        type:"narration",

        text:
        "O vento suave movimenta as árvores enquanto estudantes atravessam o campus. É o começo de uma nova fase da sua vida.",

        next:"thoughts"
    },


    thoughts:{

        type:"dialogue",

        speaker:"Você",

        text:
        "Então... é aqui que tudo vai começar.",

        next:"stranger"
    },


    stranger:{

        type:"dialogue",

        speaker:"???",

        text:
        "Primeiro dia?",

        next:"stranger2"
    },


    stranger2:{

        type:"dialogue",

        speaker:"Você",

        text:
        "Ah... sim.",

        next:"stranger3"
    },


    stranger3:{

        type:"dialogue",

        speaker:"???",

        text:
        "Dá para perceber. Você está olhando para o prédio como se estivesse tentando decorar cada janela.",

        next:"choiceFirst"
    },


    /* ==========================================
       PRIMEIRA ESCOLHA REAL
    ========================================== */

    choiceFirst:{

        type:"choice",

        text:
        "O que você faz?",

        choices:[

            {
                text:"Converso com ele.",

                action:function(){

                    memory.conversouComEstranho = true;

                    memory.affinity += 2;

                    showNode("talked");
                }
            },

            {
                text:"Observo a universidade antes de responder.",

                action:function(){

                    memory.observouUniversidade = true;

                    showNode("observed");
                }
            },

            {
                text:"Sorrio e entro imediatamente.",

                action:function(){

                    memory.entrouImediatamente = true;

                    showNode("entered");
                }
            }

        ]

    },


    /* ==========================================
       CAMINHO 1
    ========================================== */

    talked:{

        type:"dialogue",

        speaker:"Você",

        text:
        "Talvez eu esteja um pouco perdida.",

        next:"talked2"
    },


    talked2:{

        type:"dialogue",

        speaker:"???",

        text:
        "Normal. Eu também estava no meu primeiro dia.",

        next:"talked3"
    },


    talked3:{

        type:"dialogue",

        speaker:"???",

        text:
        "Aliás... acho que ainda não perguntei seu nome.",

        next:"choiceName"
    },


    choiceName:{

        type:"choice",

        text:
        "Você responde:",

        choices:[

            {
                text:"Digo meu nome.",

                action:function(){

                    memory.perguntouNome = true;

                    memory.affinity += 2;

                    showNode("gaveName");
                }
            },

            {
                text:"Brinco e digo que é segredo.",

                action:function(){

                    memory.perguntouNome = false;

                    memory.affinity += 1;

                    showNode("secretName");
                }
            }

        ]

    },


    gaveName:{

        type:"dialogue",

        speaker:"???",

        text:
        "Bonito nome.",

        next:"afterName"
    },


    afterName:{

        type:"narration",

        text:
        "Por algum motivo, aquela simples frase fica na sua cabeça enquanto você entra no campus.",

        next:"butterflyCheck"
    },


    secretName:{

        type:"dialogue",

        speaker:"???",

        text:
        "Ah... misteriosa. Entendi.",

        next:"secretName2"
    },


    secretName2:{

        type:"narration",

        text:
        "Você entra na universidade sorrindo. Talvez aquela pessoa ainda apareça novamente.",

        next:"butterflyCheck"
    },


    /* ==========================================
       CAMINHO 2
    ========================================== */

    observed:{

        type:"dialogue",

        speaker:"Você",

        text:
        "Eu estava só tentando entender onde fica cada coisa.",

        next:"observed2"
    },


    observed2:{

        type:"dialogue",

        speaker:"???",

        text:
        "Então você provavelmente vai precisar de um mapa.",

        next:"observed3"
    },


    observed3:{

        type:"narration",

        text:
        "Você ri baixinho. O estranho aponta para o prédio principal antes de seguir seu caminho.",

        next:"butterflyCheck"
    },


    /* ==========================================
       CAMINHO 3
    ========================================== */

    entered:{

        type:"narration",

        text:
        "Você decide não perder tempo. Talvez seja melhor descobrir tudo sozinha.",

        next:"entered2"
    },


    entered2:{

        type:"dialogue",

        speaker:"Você",

        text:
        "Vamos lá.",

        next:"butterflyCheck"
    },


    /* ==========================================
       EFEITO BORBOLETA
    ========================================== */

    butterflyCheck:{

        type:"conditional",

        condition:function(){

            if(
                memory.conversouComEstranho &&
                memory.perguntouNome
            ){

                return "butterflySpecial";

            }

            if(
                memory.observouUniversidade
            ){

                return "butterflyObserved";

            }

            return "butterflyNone";
        }

    },


    butterflySpecial:{

        type:"dialogue",

        speaker:"???",

        text:
        "Ei! Você esqueceu uma coisa.",

        next:"butterflySpecial2"
    },


    butterflySpecial2:{

        type:"dialogue",

        speaker:"???",

        text:
        "Eu também não disse meu nome.",

        next:"butterflySpecial3"
    },


    butterflySpecial3:{

        type:"narration",

        text:
        "Você percebe que aquele encontro aparentemente pequeno acabou de ganhar um novo significado.",

        next:"end"
    },


    butterflyObserved:{

        type:"narration",

        text:
        "Mais tarde, enquanto procura sua sala, você reconhece um detalhe do campus que havia observado antes.",

        next:"end"
    },


    butterflyNone:{

        type:"narration",

        text:
        "Você segue pelo campus sem imaginar que aquela manhã ainda vai cruzar seu caminho de outras maneiras.",

        next:"end"
    },


    /* ==========================================
       FINAL DO MINI EPISÓDIO
    ========================================== */

    end:{

        type:"end",

        text:
        "EPISÓDIO 1 — Um novo começo",

        next:null
    }

};


/* =====================================================
   MOSTRAR NÓ
===================================================== */

let currentNode = null;
let locked = false;


function showNode(id){

    const node = story[id];

    if(!node) return;

    currentNode = node;

    choiceArea.innerHTML = "";

    tapIndicator.style.display = "none";

    dialogueBox.style.cursor =
        "default";


    /* ==========================================
       NARRAÇÃO
    ========================================== */

    if(node.type === "narration"){

        dialogueText.textContent =
            node.text;

        tapIndicator.style.display =
            "block";

        dialogueBox.style.cursor =
            "pointer";

        return;
    }


    /* ==========================================
       DIÁLOGO
    ========================================== */

    if(node.type === "dialogue"){

        dialogueText.textContent =
            node.speaker
            ? node.speaker + " — " + node.text
            : node.text;

        tapIndicator.style.display =
            "block";

        dialogueBox.style.cursor =
            "pointer";

        return;
    }


    /* ==========================================
       ESCOLHA
    ========================================== */

    if(node.type === "choice"){

        dialogueText.textContent =
            node.text;

        dialogueBox.style.cursor =
            "default";

        node.choices.forEach(function(choice){

            const button =
                document.createElement("button");

            button.className =
                "choice-button";

            button.textContent =
                choice.text;

            button.addEventListener(
                "click",
                function(){

                    if(locked) return;

                    locked = true;

                    choice.action();

                    updateAffinity();

                    setTimeout(function(){

                        locked = false;

                    },100);

                }
            );

            choiceArea.appendChild(button);

        });

        return;
    }


    /* ==========================================
       CONDICIONAL
    ========================================== */

    if(node.type === "conditional"){

        const next =
            node.condition();

        showNode(next);

        return;
    }


    /* ==========================================
       FINAL
    ========================================== */

    if(node.type === "end"){

        dialogueText.textContent =
            node.text;

        tapIndicator.style.display =
            "none";

        const button =
            document.createElement("button");

        button.className =
            "restart-button";

        button.textContent =
            "Recomeçar";

        button.addEventListener(
            "click",
            resetStory
        );

        choiceArea.appendChild(button);

    }

}


/* =====================================================
   TOQUE NA CAIXA = AVANÇAR
===================================================== */

dialogueBox.addEventListener(
    "click",
    function(){

        if(!currentNode) return;

        if(
            currentNode.type === "narration" ||
            currentNode.type === "dialogue"
        ){

            if(currentNode.next){

                showNode(currentNode.next);

            }

        }

    }
);


/* =====================================================
   AFINIDADE
===================================================== */

function updateAffinity(){

    affinityDisplay.textContent =
        "♡ Afinidade " +
        memory.affinity;

}


/* =====================================================
   RESET
===================================================== */

function resetStory(){

    memory.conversouComEstranho = false;

    memory.observouUniversidade = false;

    memory.entrouImediatamente = false;

    memory.foiSozinha = false;

    memory.perguntouNome = false;

    memory.seguiuSozinhaDepois = false;

    memory.affinity = 0;

    updateAffinity();

    choiceArea.innerHTML = "";

    showNode("start");

}


/* =====================================================
   COMEÇAR
===================================================== */

startButton.addEventListener(
    "click",
    function(){

        startScreen.style.display =
            "none";

        storyScreen.style.display =
            "block";

        initAudio();

        showNode("start");

    }
);

</script>
