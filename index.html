<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doce Destino</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #120d1c;
  color: white;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #604060 0%, transparent 35%),
    linear-gradient(180deg, #24152d, #0e0914);
  position: relative;
  overflow: hidden;
}

.screen {
  min-height: 100vh;
  padding: 35px 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

h1 {
  font-size: 48px;
  margin: 0 0 10px;
  color: #ffd6ef;
  text-shadow: 0 0 20px #ff8dcc;
}

.subtitle {
  font-size: 19px;
  color: #f5dbea;
  margin-bottom: 45px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 2px solid #d98abb;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 18px;
  text-align: center;
  outline: none;
  margin-bottom: 15px;
}

input::placeholder {
  color: #c9afc3;
}

button {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #e99acb, #a95c98);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,.25);
}

button:active {
  transform: scale(.98);
}

.hidden {
  display: none !important;
}

.story {
  justify-content: flex-end;
  padding-bottom: 25px;
}

.scene {
  flex: 1;
  min-height: 45vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 70px;
  overflow: hidden;
}

.scene img {
  width: 100%;
  height: 100%;
  min-height: 45vh;
  object-fit: cover;
  border-radius: 16px;
  display: block;
}

.dialogue {
  background: rgba(10, 5, 18, .88);
  border: 1px solid rgba(255,190,230,.35);
  border-radius: 20px;
  padding: 20px;
  text-align: left;
  margin-bottom: 15px;
}

.character {
  color: #ffafd9;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.text {
  font-size: 18px;
  line-height: 1.55;
}

.choice-title {
  color: #ffd6ef;
  margin: 10px 0;
}

.status {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #eecce2;
}

.route {
  color: #ffd1e9;
}

.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #9e8398;
}
</style>
</head>

<body>

<div class="game">

  <!-- TELA INICIAL -->
  <section id="startScreen" class="screen">

    <h1>Doce Destino</h1>

    <div class="subtitle">
      Seu coração escolhe o caminho.
    </div>

    <p>
      Antes de começar sua história...
    </p>

    <p>
      <strong>Como você se chama?</strong>
    </p>

    <input
      id="playerName"
      type="text"
      maxlength="20"
      placeholder="Digite seu nome"
    >

    <button onclick="startGame()">
      Começar minha história 💗
    </button>

    <div class="footer">
      03 rotas • escolhas • afinidade • finais diferentes
    </div>

  </section>


  <!-- HISTÓRIA -->
  <section id="storyScreen" class="screen story hidden">

    <div class="status">
      <span id="playerDisplay"></span>
      <span>❤️ Afinidade: <span id="affinity">0</span></span>
    </div>

    <div class="scene" id="scene">
      🌙
    </div>

    <div class="dialogue">

      <div class="character" id="character">
        Narrador
      </div>

      <div class="text" id="storyText">
      </div>

    </div>

    <div id="choices"></div>

  </section>

</div>


<script>

let playerName = "";
let affinity = 0;
let currentStep = 0;
let route = "";

const story = [

  {
    character: "Narrador",

    text: () =>
      `Seu primeiro dia na Universidade Aurora finalmente chegou. ${playerName}, você respira fundo antes de entrar no campus.`,

    scene: "universidade-aurora.png.PNG",

    choices: [
      {
        text: "Entrar imediatamente.",
        affinity: 1,
        next: 1
      },
      {
        text: "Parar por alguns segundos e observar.",
        affinity: 0,
        next: 2
      }
    ]
  },


  {
    character: "???",

    text: () =>
      `— Ei! Você vai ficar parada aí o dia inteiro?`,

    scene: "✨",

    choices: [
      {
        text: "— Desculpa! Eu estava meio perdida.",
        affinity: 1,
        next: 3
      },
      {
        text: "— E você é quem para estar me dando ordens?",
        affinity: 0,
        next: 3
      }
    ]
  },


  {
    character: "Narrador",

    text: () =>
      `Enquanto observa o campus, três pessoas chamam sua atenção. Cada uma parece carregar uma história completamente diferente.`,

    scene: "🏫",

    choices: [
      {
        text: "Olhar para o garoto de cabelos ruivos.",
        route: "Childe",
        affinity: 1,
        next: 4
      },
      {
        text: "Olhar para o garoto de cabelos claros.",
        route: "Aether",
        affinity: 1,
        next: 5
      },
      {
        text: "Procurar alguém que pareça familiar.",
        route: "Leiftam",
        affinity: 1,
        next: 6
      }
    ]
  },


  {
    character: "Childe",

    text: () =>
      `Ele percebe seu olhar e dá um pequeno sorriso. — Você sempre olha para as pessoas desse jeito… ou eu sou uma exceção?`,

    scene: "❤️",

    choices: [
      {
        text: "— Talvez você seja uma exceção.",
        affinity: 2,
        next: 7
      },
      {
        text: "— Eu estava apenas olhando.",
        affinity: 1,
        next: 7
      }
    ]
  },


  {
    character: "Aether",

    text: () =>
      `O garoto de cabelos claros se aproxima sorrindo. — Você fica vermelha toda vez que eu chego perto. Interessante.`,

    scene: "✨",

    choices: [
      {
        text: "— Eu não estou vermelha!",
        affinity: 2,
        next: 7
      },
      {
        text: "— Talvez seja culpa sua.",
        affinity: 2,
        next: 7
      }
    ]
  },


  {
    character: "Leiftam",

    text: () =>
      `Uma voz familiar surge atrás de você. — Eu sabia que você estaria aqui. Não mudou nada, ${playerName}.`,

    scene: "🌿",

    choices: [
      {
        text: "Abraçá-lo.",
        affinity: 2,
        next: 7
      },
      {
        text: "— Você continua aparecendo do nada.",
        affinity: 1,
        next: 7
      }
    ]
  },


  {
    character: "Narrador",

    text: () =>
      `Você sente que aquele dia acabou de mudar alguma coisa. Talvez seja apenas o começo...`,

    scene: "🌙",

    choices: [
      {
        text: "Continuar.",
        affinity: 1,
        next: 7
      }
    ]
  },


  {
    character: () =>
      route || "Destino",

    text: () =>
      `E assim começa o seu Doce Destino, ${playerName}. Seu coração ainda não sabe qual caminho escolher...`,

    scene: "💗",

    choices: [
      {
        text: "Ver o que o destino preparou.",
        affinity: 1,
        next: 8
      }
    ]
  },


  {
    character: "Narrador",

    text: () =>
      `Por enquanto, esta é apenas a primeira página da sua história.

O caminho de ${playerName} está apenas começando. 💗`,

    scene: "🌌",

    choices: []
  }

];


function startGame() {

  const input =
    document.getElementById("playerName");

  playerName =
    input.value.trim();

  if (!playerName) {

    alert(
      "Digite seu nome para começar sua história. 💗"
    );

    input.focus();

    return;
  }

  affinity = 0;
  currentStep = 0;
  route = "";

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("storyScreen")
    .classList.remove("hidden");

  document
    .getElementById("playerDisplay")
    .textContent = playerName;

  showScene();
}


function showScene() {

  const current =
    story[currentStep];

  const character =
    typeof current.character === "function"
      ? current.character()
      : current.character;

  document
    .getElementById("character")
    .textContent = character;

  document
    .getElementById("storyText")
    .textContent = current.text();


  const sceneElement =
    document.getElementById("scene");


  if (
    current.scene &&
    /\.(png|jpe?g|webp|gif)$/i.test(current.scene)
  ) {

    sceneElement.innerHTML =
      `<img src="${current.scene}" alt="Cenário">`;

  } else {

    sceneElement.textContent =
      current.scene;

  }


  document
    .getElementById("affinity")
    .textContent = affinity;


  const choicesContainer =
    document.getElementById("choices");

  choicesContainer.innerHTML = "";


  if (current.choices.length === 0) {

    const restart =
      document.createElement("button");

    restart.textContent =
      "Voltar ao início 💕";

    restart.onclick = () => {

      document
        .getElementById("storyScreen")
        .classList.add("hidden");

      document
        .getElementById("startScreen")
        .classList.remove("hidden");

    };

    choicesContainer.appendChild(restart);

    return;
  }


  const title =
    document.createElement("div");

  title.className =
    "choice-title";

  title.textContent =
    "O que você vai fazer?";

  choicesContainer.appendChild(title);


  current.choices.forEach(choice => {

    const button =
      document.createElement("button");

    button.textContent =
      choice.text;

    button.onclick = () => {

      affinity +=
        choice.affinity || 0;

      if (choice.route) {
        route = choice.route;
      }

      currentStep =
        choice.next;

      showScene();

    };

    choicesContainer.appendChild(button);

  });

}

</script>

</body>
</html>
