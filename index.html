<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Doce Destino</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Georgia,"Times New Roman",serif;
color:#4b3948;
background:#f8edf5;
}

button{
font-family:inherit;
}

/* =========================
   TELA INICIAL
========================= */

.start-screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
radial-gradient(circle at 50% 35%,
rgba(255,255,255,.98),
rgba(249,232,244,.98) 55%,
rgba(235,211,230,1));
z-index:30;
}

.start-content{
width:88%;
max-width:420px;
}

.start-decoration{
font-size:32px;
color:#c99ab9;
margin-bottom:18px;
}

.logo{
font-size:42px;
font-weight:500;
letter-spacing:2px;
color:#79536d;
margin-bottom:8px;
}

.subtitle{
font-size:14px;
letter-spacing:1px;
color:#9b718d;
margin-bottom:45px;
}

.start-button,
.choice-button,
.restart-button{
border:1px solid rgba(159,111,143,.5);
background:rgba(255,255,255,.78);
color:#76516a;
border-radius:22px;
box-shadow:0 5px 18px rgba(126,76,110,.10);
}

.start-button{
padding:13px 34px;
font-size:15px;
}

.start-button:active,
.choice-button:active,
.restart-button:active{
transform:scale(.98);
}

/* =========================
   JOGO
========================= */

.story-screen{
display:none;
position:fixed;
inset:0;
overflow:hidden;
background:#e8dce6;
}

.scene{
position:absolute;
inset:0;
overflow:hidden;
}

/* =========================
   CENÁRIO DA UNIVERSIDADE
========================= */

.university-scene{
position:absolute;
inset:0;
background:
linear-gradient(
to bottom,
rgba(177,210,238,.15),
rgba(255,232,245,.08) 50%,
rgba(111,87,92,.20)
),
url("universidade-aurora.png.PNG") center/cover no-repeat;
display:none;
}

.university-scene.active{
display:block;
}

/* =========================
   CENÁRIO ANTES DA UNIVERSIDADE
========================= */

.city-scene{
position:absolute;
inset:0;
display:block;
overflow:hidden;
background:
linear-gradient(
to bottom,
#b8d9ef 0%,
#dcecf4 42%,
#efdfe4 43%,
#d8bfc9 100%
);
}

.city-sky{
position:absolute;
inset:0;
background:
radial-gradient(circle at 75% 17%,
rgba(255,255,255,.9) 0 5%,
transparent 6%),
radial-gradient(circle at 25% 20%,
rgba(255,255,255,.75) 0 4%,
transparent 5%);
}

.city-building{
position:absolute;
bottom:24%;
width:29%;
height:38%;
background:
linear-gradient(
90deg,
rgba(126,101,116,.9) 0 8%,
rgba(229,211,219,.95) 8% 92%,
rgba(126,101,116,.9) 92%
);
border-radius:5px 5px 0 0;
box-shadow:0 10px 25px rgba(80,55,75,.12);
}

.city-building:nth-child(1){
left:0;
height:45%;
}

.city-building:nth-child(2){
left:34%;
width:32%;
height:53%;
}

.city-building:nth-child(3){
right:0;
height:41%;
}

.windows{
position:absolute;
inset:12% 10%;
background:
repeating-linear-gradient(
90deg,
transparent 0 16px,
rgba(130,174,196,.7) 17px 27px,
transparent 28px 45px
),
repeating-linear-gradient(
0deg,
transparent 0 20px,
rgba(130,174,196,.65) 21px 31px,
transparent 32px 55px
);
opacity:.7;
}

.street{
position:absolute;
left:0;
right:0;
bottom:0;
height:27%;
background:
linear-gradient(
to bottom,
#c7adb9,
#aa8c9c
);
}

.sidewalk{
position:absolute;
bottom:22%;
left:0;
right:0;
height:7%;
background:#eadfe4;
box-shadow:0 -3px 8px rgba(80,50,70,.1);
}

.street-line{
position:absolute;
bottom:9%;
left:0;
right:0;
height:3px;
background:rgba(255,255,255,.45);
}

.cafe{
position:absolute;
bottom:25%;
left:6%;
width:31%;
height:20%;
background:rgba(250,240,244,.95);
border:2px solid rgba(121,83,109,.2);
border-radius:8px 8px 0 0;
box-shadow:0 8px 20px rgba(80,50,70,.12);
}

.cafe-sign{
position:absolute;
top:-25px;
left:20%;
width:60%;
padding:5px;
text-align:center;
font-size:11px;
color:#76516a;
background:#fff5fa;
border:1px solid rgba(121,83,109,.2);
border-radius:12px;
}

.cafe-window{
position:absolute;
left:10%;
right:10%;
top:25%;
height:48%;
background:
linear-gradient(
135deg,
rgba(150,194,208,.75),
rgba(245,232,237,.7)
);
border:4px solid #e6d3dc;
}

/* =========================
   FOLHAS
========================= */

.wind-layer{
position:absolute;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:3;
}

.leaf{
position:absolute;
width:9px;
height:5px;
border-radius:100% 0 100% 0;
background:rgba(255,244,250,.7);
animation:windLeaf linear infinite;
}

.leaf:nth-child(1){
left:5%;
top:20%;
animation-duration:8s;
}

.leaf:nth-child(2){
left:32%;
top:8%;
animation-duration:10s;
animation-delay:2s;
}

.leaf:nth-child(3){
left:65%;
top:18%;
animation-duration:7s;
animation-delay:1s;
}

.leaf:nth-child(4){
left:85%;
top:28%;
animation-duration:11s;
animation-delay:3s;
}

@keyframes windLeaf{
0%{
transform:translate(-20px,-20px) rotate(0);
opacity:0;
}
15%{
opacity:.8;
}
100%{
transform:translate(150px,90vh) rotate(360deg);
opacity:0;
}
}

/* =========================
   HUD
========================= */

.hud{
position:absolute;
top:15px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:15;
}

.player-card,
.affinity,
.sound-button{
border:1px solid rgba(255,255,255,.7);
background:rgba(255,255,255,.58);
backdrop-filter:blur(8px);
box-shadow:0 3px 14px rgba(80,50,70,.1);
}

.player-card{
display:flex;
align-items:center;
gap:8px;
padding:6px 11px 6px 7px;
border-radius:30px;
}

.player-avatar{
width:32px;
height:32px;
border-radius:50%;
background:rgba(255,255,255,.82);
border:1px solid rgba(160,120,145,.35);
display:flex;
align-items:center;
justify-content:center;
color:#a47792;
font-size:17px;
}

.player-name{
font-size:13px;
color:#684d60;
}

.affinity{
padding:7px 11px;
border-radius:20px;
color:#76516a;
font-size:12px;
}

/* =========================
   SOM
========================= */

.sound-button{
position:absolute;
right:15px;
top:61px;
z-index:16;
width:36px;
height:36px;
border-radius:50%;
color:#76516a;
font-size:16px;
}

.audio-panel{
display:none;
position:absolute;
right:15px;
top:105px;
z-index:20;
width:205px;
padding:15px;
border-radius:18px;
border:1px solid rgba(255,255,255,.7);
background:rgba(255,248,252,.92);
backdrop-filter:blur(12px);
box-shadow:0 8px 25px rgba(80,50,70,.16);
}

.audio-row{
margin-bottom:12px;
}

.audio-row label{
display:block;
font-size:11px;
color:#76516a;
margin-bottom:5px;
}

.audio-row input{
width:100%;
}

.mute-button{
border:1px solid rgba(159,111,143,.4);
background:white;
color:#76516a;
padding:6px 12px;
font-size:11px;
border-radius:14px;
}

/* =========================
   CHILDE
========================= */

.childe-layer{
display:none;
position:absolute;
left:0;
right:0;
top:5%;
bottom:22%;
z-index:8;
pointer-events:none;
align-items:flex-end;
justify-content:center;
}

.childe-layer.visible{
display:flex;
}

.childe-sprite{
height:100%;
width:auto;
max-width:90%;
object-fit:contain;
object-position:center bottom;
filter:drop-shadow(0 10px 12px rgba(55,35,50,.15));
animation:childeBreath 3.6s ease-in-out infinite;
}

@keyframes childeBreath{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-4px);
}
}

/* =========================
   DIÁLOGO
========================= */

.bottom-area{
position:absolute;
left:0;
right:0;
bottom:0;
padding:0 12px 12px;
z-index:18;
}

.dialogue-box{
position:relative;
width:100%;
min-height:120px;
max-height:31vh;
padding:17px 20px 25px;
border:1px solid rgba(255,255,255,.9);
border-radius:21px;
background:rgba(255,250,253,.90);
backdrop-filter:blur(13px);
box-shadow:
0 7px 28px rgba(71,46,65,.18),
inset 0 1px rgba(255,255,255,.7);
cursor:pointer;
touch-action:manipulation;
}

.dialogue-speaker{
font-size:12px;
letter-spacing:.3px;
font-weight:600;
color:#966582;
margin-bottom:6px;
}

.dialogue-text{
font-size:14px;
line-height:1.58;
color:#4d3c49;
min-height:67px;
}

.tap-indicator{
position:absolute;
right:15px;
bottom:8px;
color:#a77b97;
font-size:18px;
animation:tapPulse 1.5s ease-in-out infinite;
}

@keyframes tapPulse{
0%,100%{
opacity:.35;
transform:translateX(0);
}
50%{
opacity:1;
transform:translateX(4px);
}
}

/* =========================
   ESCOLHAS
========================= */

.choice-area{
display:flex;
flex-direction:column;
gap:8px;
margin-top:9px;
}

.choice-button{
width:100%;
padding:10px 14px;
font-size:13px;
line-height:1.3;
}

.choice-button::before{
content:"♡";
margin-right:8px;
color:#bd8baa;
}

.restart-button{
padding:9px 20px;
font-size:12px;
margin-top:8px;
}

@media(min-width:700px){

.bottom-area{
left:50%;
transform:translateX(-50%);
width:650px;
}

.hud{
left:25px;
right:25px;
}

.sound-button{
right:25px;
}

.audio-panel{
right:25px;
}
}

@media(max-height:700px){

.childe-layer{
top:3%;
bottom:24%;
}

.dialogue-box{
min-height:105px;
padding-top:13px;
}

.dialogue-text{
font-size:13px;
min-height:55px;
}
}
</style>
</head>

<body>

<script>

/* =====================================================
   MEMÓRIA
===================================================== */

const memory = {

encontrouChilde:false,

foiGentil:false,

foiProvocadora:false,

manteveDistancia:false,

perguntouNome:false,

disseNome:false,

childeSeApresentou:false,

descobriuUniversidade:false,

affinity:0,

expression:"franzindo"

};


/* =====================================================
   SPRITES
===================================================== */

const sprites = {

alegre:
"childe-alegre-transparente.png.PNG",

franzindo:
"childe-Franzindo a testa-transparente.png.PNG",

raiva:
"childe-Com raiva-transparente.png.PNG",

decepcionado:
"childe-Decepcionado-transparente.png.PNG"

};


/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
document.getElementById("startScreen");

const storyScreen =
document.getElementById("storyScreen");

const cityScene =
document.getElementById("cityScene");

const universityScene =
document.getElementById("universityScene");

const startButton =
document.getElementById("startButton");

const childeLayer =
document.getElementById("childeLayer");

const childeSprite =
document.getElementById("childeSprite");

const dialogueBox =
document.getElementById("dialogueBox");

const dialogueSpeaker =
document.getElementById("dialogueSpeaker");

const dialogueText =
document.getElementById("dialogueText");

const tapIndicator =
document.getElementById("tapIndicator");

const choiceArea =
document.getElementById("choiceArea");

const affinityDisplay =
document.getElementById("affinity");


/* =====================================================
   CENÁRIOS
===================================================== */

function showCity(){

cityScene.style.display =
"block";

universityScene.classList.remove(
"active"
);

}


function showUniversity(){

cityScene.style.display =
"none";

universityScene.classList.add(
"active"
);

}


/* =====================================================
   CHILDE
===================================================== */

function showChilde(expression){

memory.expression =
expression;

childeSprite.src =
sprites[expression];

childeLayer.classList.add(
"visible"
);

}


function hideChilde(){

childeLayer.classList.remove(
"visible"
);

childeSprite.src =
"";

}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;
let musicGain = null;
let ambientGain = null;
let musicStarted = false;
let muted = false;


function initAudio(){

if(audioContext)
return;

audioContext =
new(
window.AudioContext ||
window.webkitAudioContext
)();

musicGain =
audioContext.createGain();

ambientGain =
audioContext.createGain();

musicGain.gain.value =
.35;

ambientGain.gain.value =
.10;

musicGain.connect(
audioContext.destination
);

ambientGain.connect(
audioContext.destination
);

startMusic();

}


function startMusic(){

if(musicStarted)
return;

musicStarted = true;

const notes = [
261.63,
329.63,
392,
329.63,
293.66,
349.23,
440,
349.23
];

let i = 0;

function playNote(){

if(!audioContext)
return;

const osc =
audioContext.createOscillator();

const gain =
audioContext.createGain();

osc.type =
"sine";

osc.frequency.value =
notes[i];

gain.gain.setValueAtTime(
0,
audioContext.currentTime
);

gain.gain.linearRampToValueAtTime(
.045,
audioContext.currentTime + .08
);

gain.gain.linearRampToValueAtTime(
0,
audioContext.currentTime + 1.3
);

osc.connect(gain);
gain.connect(musicGain);

osc.start();

osc.stop(
audioContext.currentTime + 1.4
);

i =
(i + 1) %
notes.length;

setTimeout(
playNote,
1100
);

}

playNote();

}


/* =====================================================
   CONTROLES DE SOM
===================================================== */

document
.getElementById("soundButton")
.onclick =
function(e){

e.stopPropagation();

const panel =
document.getElementById(
"audioPanel"
);

panel.style.display =
panel.style.display === "block"
? "none"
: "block";

};


document
.getElementById("musicVolume")
.addEventListener(
"input",
function(){

if(musicGain)
musicGain.gain.value =
muted ? 0 : this.value;

}
);


document
.getElementById("ambientVolume")
.addEventListener(
"input",
function(){

if(ambientGain)
ambientGain.gain.value =
muted ? 0 : this.value;

}
);


document
.getElementById("muteButton")
.onclick =
function(){

muted =
!muted;

if(musicGain)
musicGain.gain.value =
muted
? 0
: document.getElementById(
"musicVolume"
).value;

if(ambientGain)
ambientGain.gain.value =
muted
? 0
: document.getElementById(
"ambientVolume"
).value;

this.textContent =
muted
? "Ativar som"
: "Silenciar";

};


/* =====================================================
   HISTÓRIA
===================================================== */

const story = {

/* ---------- COMEÇO ---------- */

start:{
type:"narration",
text:
"Você acabou de chegar à cidade onde fica a Universidade Aurora. Uma nova cidade, uma nova fase... e nenhum plano muito bem organizado.",
next:"cityWalk"
},

cityWalk:{
type:"narration",
text:
"Com uma mala ao lado e o celular na mão, você tenta descobrir onde fica o endereço que recebeu.",
next:"lost"
},

lost:{
type:"dialogue",
speaker:"Você",
text:
"Meu Deus... eu devia ter olhado isso antes de sair.",
next:"encounter"
},


/* ---------- PRIMEIRO ENCONTRO ---------- */

encounter:{
type:"dialogue",
speaker:"???",
text:
"Você está procurando alguma coisa?",
next:"encounter2"
},

encounter2:{
type:"dialogue",
speaker:"Você",
text:
"Estou tentando encontrar um lugar.",
next:"encounter3"
},

encounter3:{
type:"dialogue",
speaker:"???",
text:
"Isso eu percebi.",
next:"encounter4"
},

encounter4:{
type:"dialogue",
speaker:"???",
text:
"Você está olhando esse mapa há uns cinco minutos.",
next:"firstChoice"
},


/* ---------- PRIMEIRA ESCOLHA ---------- */

firstChoice:{
type:"choice",
text:
"Como você responde?",
choices:[

{
text:"Peço ajuda para encontrar o endereço.",
action:function(){

memory.encontrouChilde =
true;

memory.foiGentil =
true;

memory.affinity += 2;

showChilde("alegre");

showNode("helpMe");

}
},

{
text:"Digo que não estou perdida.",
action:function(){

memory.encontrouChilde =
true;

memory.foiProvocadora =
true;

memory.affinity += 1;

showChilde("alegre");

showNode("notLost");

}
},

{
text:"Agradeço, mas digo que consigo me virar.",
action:function(){

memory.encontrouChilde =
true;

memory.manteveDistancia =
true;

showChilde("franzindo");

showNode("alone");

}
}

]
},


/* ---------- CAMINHO GENTIL ---------- */

helpMe:{
type:"dialogue",
speaker:"Você",
text:
"Você poderia me ajudar? É meu primeiro dia aqui.",
next:"helpMe2"
},

helpMe2:{
type:"dialogue",
speaker:"???",
text:
"Claro. Deixa eu ver.",
next:"helpMe3"
},

helpMe3:{
type:"dialogue",
speaker:"???",
text:
"Você está indo para o lado errado.",
next:"helpMe4"
},

helpMe4:{
type:"dialogue",
speaker:"Você",
text:
"Sério?",
next:"helpMe5"
},

helpMe5:{
type:"dialogue",
speaker:"???",
text:
"Sério. Vem, eu te mostro.",
next:"walking"
},


/* ---------- CAMINHO PROVOCADOR ---------- */

notLost:{
type:"dialogue",
speaker:"Você",
text:
"Eu não estou perdida.",
next:"notLost2"
},

notLost2:{
type:"dialogue",
speaker:"???",
text:
"Ah, não?",
next:"notLost3"
},

notLost3:{
type:"dialogue",
speaker:"Você",
text:
"Estou apenas... explorando.",
next:"notLost4"
},

notLost4:{
type:"dialogue",
speaker:"???",
text:
"Então você está explorando a direção errada.",
next:"walking"
},

/* =====================================================
   MOSTRAR NÓ
===================================================== */

let currentNode =
null;


function showNode(id){

const node =
story[id];

if(!node)
return;

currentNode =
node;

choiceArea.innerHTML =
"";

tapIndicator.style.display =
"none";


/* MUDANÇA DE CENÁRIO */

if(id === "universityArrival"){

showUniversity();

}


/* NARRAÇÃO */

if(node.type === "narration"){

dialogueSpeaker.textContent =
"";

dialogueText.textContent =
node.text;

tapIndicator.style.display =
"block";

return;

}


/* DIÁLOGO */

if(node.type === "dialogue"){

dialogueSpeaker.textContent =
node.speaker || "";

dialogueText.textContent =
node.text;

tapIndicator.style.display =
"block";

return;

}


/* ESCOLHA */

if(node.type === "choice"){

dialogueSpeaker.textContent =
"";

dialogueText.textContent =
node.text;

node.choices.forEach(
function(choice){

const button =
document.createElement(
"button"
);

button.className =
"choice-button";

button.textContent =
choice.text;

button.addEventListener(
"click",
function(){

choice.action();

updateAffinity();

}
);

choiceArea.appendChild(
button
);

}
);

return;
}


/* FINAL */

if(node.type === "end"){

dialogueSpeaker.textContent =
"";

dialogueText.textContent =
node.text;

const button =
document.createElement(
"button"
);

button.className =
"restart-button";

button.textContent =
"Recomeçar";

button.addEventListener(
"click",
resetStory
);

choiceArea.appendChild(
button
);

}

}


/* =====================================================
   AVANÇAR TOCANDO NA CAIXA
===================================================== */

dialogueBox.addEventListener(
"click",
function(){

if(!currentNode)
return;

if(
currentNode.type === "narration" ||
currentNode.type === "dialogue"
){

if(currentNode.next){

showNode(
currentNode.next
);

}

}

}
);


/* =====================================================
   AFINIDADE
===================================================== */

function updateAffinity(){

affinityDisplay.textContent =
"♡ Afinidade " +
memory.affinity;

}


/* =====================================================
   REINICIAR
===================================================== */

function resetStory(){

Object.assign(
memory,
{
encontrouChilde:false,
foiGentil:false,
foiProvocadora:false,
manteveDistancia:false,
perguntouNome:false,
disseNome:false,
childeSeApresentou:false,
descobriuUniversidade:false,
affinity:0,
expression:"franzindo"
}
);

hideChilde();

showCity();

updateAffinity();

showNode(
"start"
);

}


/* =====================================================

===================================================== */

"start"
);

}
);


updateAffinity();

</script>
