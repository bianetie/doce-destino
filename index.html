<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Doce Destino</title>

<style>

/* ================================
   BASE
================================ */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #130d18;
  color: #fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}


/* ================================
   JOGO
================================ */

.game {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
}


/* ================================
   TELA INICIAL
================================ */

.start-screen {
  position: absolute;
  inset: 0;
  z-index: 100;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 30px;

  text-align: center;

  background:
    radial-gradient(
      circle at center,
      #815677,
      #211322 70%,
      #110b16
    );
}

.start-screen.hidden {
  display: none;
}

.start-title {
  margin: 0;

  font-size: clamp(38px, 10vw, 58px);

  font-weight: normal;
  letter-spacing: 1px;

  color: #fff4fb;

  text-shadow:
    0 2px 10px rgba(0,0,0,.35);
}

.start-subtitle {
  margin: 10px 0 32px;

  font-size: 16px;

  color: #f6dbe9;

  font-style: italic;
}

.name-input {
  width: min(310px, 88vw);

  padding: 14px 18px;

  border: 1px solid rgba(255,255,255,.4);
  border-radius: 16px;

  outline: none;

  background: rgba(30,16,34,.72);

  color: white;

  text-align: center;

  font-size: 16px;
}

.name-input::placeholder {
  color: rgba(255,255,255,.65);
}

.start-button {
  width: min(310px, 88vw);

  margin-top: 14px;

  padding: 14px 20px;

  border: 1px solid rgba(255,255,255,.32);
  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #a86598,
      #814d79
    );

  color: white;

  font-size: 17px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.25);
}

.start-button:active {
  transform: scale(.98);
}


/* ================================
   HISTÓRIA
================================ */

.story-screen {
  position: absolute;
  inset: 0;

  display: none;

  overflow: hidden;

  background: #140d19;
}

.story-screen.active {
  display: block;
}


/* ================================
   CENÁRIO
================================ */

.scene {
  position: absolute;
  inset: 0;

  overflow: hidden;

  background: #151020;
}

.scene img {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 115%;
  height: 115%;

  max-width: none;

  object-fit: cover;

  transform-origin: center;

  animation:
    auroraCamera 22s ease-in-out infinite alternate;
}

@keyframes auroraCamera {

  0% {
    transform:
      translate(-50%, -50%)
      scale(1.02)
      translate3d(-.4%, 0, 0);
  }

  50% {
    transform:
      translate(-50%, -50%)
      scale(1.06)
      translate3d(.4%, -.3%, 0);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1.09)
      translate3d(-.3%, .4%, 0);
  }
}


/* ================================
   SOMBRA DELICADA
================================ */

.scene::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(15,7,20,.10),
      transparent 35%,
      rgba(12,5,18,.58) 100%
    );
}


/* ================================
   PÉTALAS
================================ */

.wind-layer {
  position: absolute;
  inset: 0;

  z-index: 5;

  overflow: hidden;

  pointer-events: none;
}

.leaf {
  position: absolute;

  width: 12px;
  height: 7px;

  border-radius:
    100% 0 100% 0;

  background:
    rgba(255,196,220,.86);

  animation:
    windLeaf linear infinite;

  opacity: 0;
}

.leaf:nth-child(1) {
  left: 5%;
  top: 17%;
  animation-duration: 7s;
  animation-delay: -2s;
}

.leaf:nth-child(2) {
  left: 20%;
  top: 25%;
  animation-duration: 9s;
  animation-delay: -5s;
}

.leaf:nth-child(3) {
  left: 35%;
  top: 12%;
  animation-duration: 8s;
  animation-delay: -1s;
}

.leaf:nth-child(4) {
  left: 52%;
  top: 22%;
  animation-duration: 10s;
  animation-delay: -6s;
}

.leaf:nth-child(5) {
  left: 68%;
  top: 15%;
  animation-duration: 8s;
  animation-delay: -3s;
}

.leaf:nth-child(6) {
  left: 84%;
  top: 28%;
  animation-duration: 11s;
  animation-delay: -7s;
}

.leaf:nth-child(7) {
  left: 12%;
  top: 40%;
  animation-duration: 9s;
  animation-delay: -4s;
}

.leaf:nth-child(8) {
  left: 60%;
  top: 38%;
  animation-duration: 8s;
  animation-delay: -6s;
}

@keyframes windLeaf {

  0% {
    transform:
      translate3d(-20px,-10px,0)
      rotate(0);
    opacity: 0;
  }

  12% {
    opacity: .9;
  }

  45% {
    transform:
      translate3d(150px,65px,0)
      rotate(170deg);
  }

  75% {
    transform:
      translate3d(280px,30px,0)
      rotate(300deg);
  }

  100% {
    transform:
      translate3d(420px,140px,0)
      rotate(430deg);
    opacity: 0;
  }
}


/* ================================
   ÁGUA
================================ */

.water-effect {
  position: absolute;

  left: 50%;
  top: 76%;

  width: 190px;
  height: 60px;

  transform:
    translate(-50%, -50%);

  z-index: 6;

  pointer-events: none;
}

.ripple {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 25px;
  height: 8px;

  transform:
    translate(-50%, -50%);

  border:
    1.5px solid rgba(255,255,255,.45);

  border-radius: 50%;

  animation:
    rippleWater 3.2s ease-out infinite;
}

.ripple:nth-child(2) {
  animation-delay: 1.05s;
}

.ripple:nth-child(3) {
  animation-delay: 2.1s;
}

@keyframes rippleWater {

  0% {
    width: 25px;
    height: 8px;
    opacity: .65;
  }

  100% {
    width: 165px;
    height: 42px;
    opacity: 0;
  }
}

.water-shimmer {
  position: absolute;

  left: 50%;
  top: 73%;

  width: 130px;
  height: 4px;

  transform:
    translateX(-50%);

  z-index: 7;

  pointer-events: none;

  background:
    rgba(255,255,255,.32);

  filter: blur(3px);

  animation:
    waterShimmer 2.5s ease-in-out infinite;
}

@keyframes waterShimmer {

  0%,
  100% {
    transform:
      translateX(-65%)
      scaleX(.55);

    opacity: .15;
  }

  50% {
    transform:
      translateX(-35%)
      scaleX(1.1);

    opacity: .55;
  }
}


/* ================================
   HUD
================================ */

.hud {
  position: absolute;

  top: 17px;
  left: 18px;
  right: 18px;

  z-index: 20;

  display: flex;

  align-items: center;
  justify-content: space-between;
}

.player-info {
  display: flex;

  align-items: center;

  gap: 9px;
}

.player-avatar {
  width: 58px;
  height: 58px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border:
    1px solid rgba(255,255,255,.65);

  background:
    linear-gradient(
      145deg,
      rgba(190,110,170,.92),
      rgba(119,63,113,.92)
    );

  color: white;

  font-size: 27px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.28);
}

.player-name {
  font-size: 22px;

  font-weight: normal;

  text-shadow:
    0 2px 6px rgba(0,0,0,.75);
}

.affinity {
  display: flex;

  align-items: center;

  gap: 6px;

  padding: 9px 13px;

  border-radius: 20px;

  background:
    rgba(40,21,45,.72);

  border:
    1px solid rgba(255,255,255,.2);

  font-size: 16px;
}

.affinity-heart {
  font-size: 19px;
}


/* ================================
   PARTE INFERIOR
================================ */

.bottom-area {
  position: absolute;

  left: 18px;
  right: 18px;
  bottom: 16px;

  z-index: 20;
}


/* ================================
   TEXTO
================================ */

.dialogue-box {
  padding: 17px 19px;

  border-radius: 20px;

  background:
    rgba(19,10,25,.87);

  border:
    1px solid rgba(255,255,255,.19);

  box-shadow:
    0 6px 20px rgba(0,0,0,.28);

  backdrop-filter:
    blur(4px);

  -webkit-backdrop-filter:
    blur(4px);
}

.dialogue-text {
  margin: 0;

  font-size:
    clamp(15px, 3.9vw, 18px);

  line-height: 1.42;

  color: #fffafa;

  font-weight: normal;
}


/* ================================
   ESCOLHAS
================================ */

.choices {
  display: flex;

  flex-direction: column;

  gap: 8px;

  margin-top: 9px;
}

.choice-button {
  width: 100%;

  padding: 12px 17px;

  border-radius: 15px;

  border:
    1px solid rgba(255,255,255,.28);

  background:
    linear-gradient(
      135deg,
      rgba(148,78,132,.88),
      rgba(103,55,96,.92)
    );

  color: #fff;

  text-align: left;

  font-size:
    clamp(14px, 3.7vw, 17px);

  font-weight: normal;

  box-shadow:
    0 3px 12px rgba(0,0,0,.22);

  transition:
    transform .15s ease,
    background .15s ease;
}

.choice-button::before {
  content: "❀ ";

  opacity: .75;

  font-size: 12px;
}

.choice-button:active {
  transform: scale(.985);

  background:
    linear-gradient(
      135deg,
      rgba(170,94,151,.95),
      rgba(115,62,108,.95)
    );
}


/* ================================
   BOTÃO DE CONFIGURAÇÕES
================================ */

.sound-button {
  position: absolute;

  right: 18px;
  bottom: 180px;

  z-index: 40;

  width: 43px;
  height: 43px;

  border-radius: 50%;

  border:
    1px solid rgba(255,255,255,.3);

  background:
    rgba(28,17,35,.72);

  color: white;

  font-size: 19px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.3);
}


/* ================================
   PAINEL DE SOM
================================ */

.audio-panel {
  position: absolute;

  right: 18px;
  bottom: 230px;

  z-index: 50;

  width: 215px;

  padding: 16px;

  border-radius: 20px;

  border:
    1px solid rgba(255,255,255,.25);

  background:
    rgba(31,17,36,.94);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

  display: none;
}

.audio-panel.open {
  display: block;
}

.audio-title {
  margin: 0 0 13px;

  font-size: 17px;

  font-weight: normal;

  color: #f8dfeb;
}

.volume-row {
  margin-bottom: 13px;
}

.volume-label {
  display: flex;

  justify-content: space-between;

  margin-bottom: 5px;

  font-size: 13px;

  color: #f2dce8;
}

.volume-value {
  opacity: .7;
}

.volume-slider {
  width: 100%;

  accent-color: #c27bad;
}

.mute-button {
  width: 100%;

  padding: 9px;

  border-radius: 12px;

  border:
    1px solid rgba(255,255,255,.2);

  background:
    rgba(133,70,119,.7);

  color: white;

  font-size: 14px;
}


/* ================================
   CELULARES PEQUENOS
================================ */

@media (max-height: 700px) {

  .hud {
    top: 9px;
  }

  .player-avatar {
    width: 51px;
    height: 51px;
    font-size: 24px;
  }

  .player-name {
    font-size: 20px;
  }

  .affinity {
    padding: 7px 10px;
  }

  .bottom-area {
    bottom: 9px;
  }

  .dialogue-box {
    padding: 14px 16px;
  }

  .dialogue-text {
    font-size: 15px;
  }

  .choice-button {
    padding: 10px 14px;
    font-size: 14px;
  }

  .sound-button {
    bottom: 166px;
  }

  .audio-panel {
    bottom: 215px;
  }
}

</style>
</head>


<body>

<div class="game">


  <!-- ================================
       INÍCIO
  ================================= -->

  <section
    id="startScreen"
    class="start-screen"
  >

    <h1 class="start-title">
      Doce Destino
    </h1>

    <p class="start-subtitle">
      Seu coração escolhe o caminho.
    </p>

    <input
      id="nameInput"
      class="name-input"
      type="text"
      maxlength="20"
      placeholder="Digite seu nome..."
      autocomplete="off"
    >

    <button
      id="startButton"
      class="start-button"
      type="button"
    >
      Começar minha história ♡
    </button>

  </section>


  <!-- ================================
       HISTÓRIA
  ================================= -->

  <section
    id="storyScreen"
    class="story-screen"
  >


    <div class="scene">

      <img
        src="universidade-aurora.png.PNG"
        alt="Universidade Aurora"
      >


      <!-- PÉTALAS -->

      <div class="wind-layer">

        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>

      </div>


      <!-- ÁGUA -->

      <div class="water-effect">

        <span class="ripple"></span>
        <span class="ripple"></span>
        <span class="ripple"></span>

      </div>

      <div class="water-shimmer"></div>

    </div>


    <!-- HUD -->

    <div class="hud">

      <div class="player-info">

        <div
          id="playerAvatar"
          class="player-avatar"
        >
          ♡
        </div>

        <div
          id="playerName"
          class="player-name"
        >
          Bia
        </div>

      </div>


      <div class="affinity">

        <span class="affinity-heart">
          ❤️
        </span>

        <span id="affinityValue">
          0
        </span>

      </div>

    </div>


    <!-- CONFIGURAÇÕES DE SOM -->

    <button
      id="soundButton"
      class="sound-button"
      type="button"
      aria-label="Abrir configurações de som"
    >
      ♫
    </button>


    <div
      id="audioPanel"
      class="audio-panel"
    >

      <p class="audio-title">
        ♡ Som do ambiente
      </p>


      <div class="volume-row">

        <div class="volume-label">
          <span>🎵 Música</span>
          <span
            id="musicValue"
            class="volume-value"
          >
            35%
          </span>
        </div>

        <input
          id="musicSlider"
          class="volume-slider"
          type="range"
          min="0"
          max="100"
          value="35"
        >

      </div>


      <div class="volume-row">

        <div class="volume-label">
          <span>🐦 Ambiente</span>
          <span
            id="ambienceValue"
            class="volume-value"
          >
            10%
          </span>
        </div>

        <input
          id="ambienceSlider"
          class="volume-slider"
          type="range"
          min="0"
          max="100"
          value="10"
        >

      </div>


      <div class="volume-row">

        <div class="volume-label">
          <span>✨ Efeitos</span>
          <span
            id="effectsValue"
            class="volume-value"
          >
            35%
          </span>
        </div>

        <input
          id="effectsSlider"
          class="volume-slider"
          type="range"
          min="0"
          max="100"
          value="35"
        >

      </div>


      <button
        id="muteButton"
        class="mute-button"
        type="button"
      >
        🔇 Silenciar tudo
      </button>

    </div>


    <!-- HISTÓRIA -->

    <div class="bottom-area">

      <div class="dialogue-box">

        <p
          id="dialogueText"
          class="dialogue-text"
        ></p>

      </div>


      <div
        id="choices"
        class="choices"
      ></div>

    </div>


  </section>

</div>


<script>

/* =========================================
   ESTADO
========================================= */

let playerName = "Bia";

let affinity = 0;

let currentScene = 0;

let audioContext = null;

let musicTimer = null;

let birdTimer = null;

let soundEnabled = true;

let musicVolume = 0.35;

let ambienceVolume = 0.10;

let effectsVolume = 0.35;

let musicGain = null;

let ambienceGain = null;

let effectsGain = null;


/* =========================================
   ELEMENTOS
========================================= */

const startScreen =
  document.getElementById("startScreen");

const storyScreen =
  document.getElementById("storyScreen");

const nameInput =
  document.getElementById("nameInput");

const startButton =
  document.getElementById("startButton");

const playerNameElement =
  document.getElementById("playerName");

const affinityElement =
  document.getElementById("affinityValue");

const dialogueText =
  document.getElementById("dialogueText");

const choicesElement =
  document.getElementById("choices");

const soundButton =
  document.getElementById("soundButton");

const audioPanel =
  document.getElementById("audioPanel");

const musicSlider =
  document.getElementById("musicSlider");

const ambienceSlider =
  document.getElementById("ambienceSlider");

const effectsSlider =
  document.getElementById("effectsSlider");

const musicValue =
  document.getElementById("musicValue");

const ambienceValue =
  document.getElementById("ambienceValue");

const effectsValue =
  document.getElementById("effectsValue");

const muteButton =
  document.getElementById("muteButton");


/* =========================================
   HISTÓRIA
========================================= */

const story = [

  {
    text:
      "Seu primeiro dia na Universidade Aurora finalmente chegou. {name}, você respira fundo antes de entrar no campus.",

    choices: [

      {
        text: "Entrar imediatamente.",
        affinity: 1,
        next: 1
      },

      {
        text: "Parar por alguns segundos e observar.",
        affinity: 2,
        next: 1
      }

    ]
  },

  {
    text:
      "A brisa passa suavemente pelo jardim. Pétalas rosadas atravessam seu campo de visão enquanto a água da fonte dança ao longe.",

    choices: [

      {
        text: "Sorrir e continuar caminhando.",
        affinity: 1,
        next: 2
      },

      {
        text: "Observar a universidade com atenção.",
        affinity: 2,
        next: 2
      }

    ]
  },

  {
    text:
      "Há algo naquele lugar que faz seu coração bater um pouco mais rápido. Talvez seja apenas a ansiedade de começar uma nova vida.",

    choices: [

      {
        text: "Pensar no futuro.",
        affinity: 1,
        next: 3
      },

      {
        text: "Deixar o momento simplesmente acontecer.",
        affinity: 2,
        next: 3
      }

    ]
  },

  {
    text:
      "Você atravessa os portões da Universidade Aurora. O som distante dos pássaros acompanha seus primeiros passos pelo campus.",

    choices: [

      {
        text: "Continuar explorando.",
        affinity: 1,
        next: 4
      },

      {
        text: "Procurar alguém para conversar.",
        affinity: 2,
        next: 4
      }

    ]
  },

  {
    text:
      "Então, entre os estudantes que atravessam o jardim, uma presença chama sua atenção.",

    choices: [

      {
        text: "Olhar discretamente.",
        affinity: 2,
        next: 5
      },

      {
        text: "Desviar o olhar.",
        affinity: 1,
        next: 5
      }

    ]
  },

  {
    text:
      "Por alguns segundos, seus olhares parecem se encontrar. Você ainda não sabe, mas aquele momento será o começo de algo importante.",

    choices: [

      {
        text: "Sustentar o olhar.",
        affinity: 2,
        next: 6
      },

      {
        text: "Continuar andando.",
        affinity: 1,
        next: 6
      }

    ]
  },

  {
    text:
      "Um novo capítulo começa. E talvez seu coração já saiba que essa universidade guarda muito mais do que você imaginava.",

    choices: [

      {
        text: "Continuar.",
        affinity: 2,
        next: 0
      }

    ]
  }

];


/* =========================================
   MOSTRAR CENA
========================================= */

function showScene() {

  const scene =
    story[currentScene];

  dialogueText.textContent =
    scene.text.replace(
      "{name}",
      playerName
    );

  affinityElement.textContent =
    affinity;

  choicesElement.innerHTML = "";


  scene.choices.forEach(
    choice => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "choice-button";

      button.textContent =
        choice.text;


      button.addEventListener(
        "click",
        () => {

          affinity +=
            choice.affinity || 0;

          currentScene =
            choice.next;

          showScene();

        }
      );


      choicesElement.appendChild(
        button
      );

    }
  );

}


/* =========================================
   ÁUDIO
========================================= */

function createAudio() {

  if (audioContext) {
    return;
  }

  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    musicGain =
      audioContext.createGain();

    ambienceGain =
      audioContext.createGain();

    effectsGain =
      audioContext.createGain();


    musicGain.gain.value =
      musicVolume;

    ambienceGain.gain.value =
      ambienceVolume;

    effectsGain.gain.value =
      effectsVolume;


    musicGain.connect(
      audioContext.destination
    );

    ambienceGain.connect(
      audioContext.destination
    );

    effectsGain.connect(
      audioContext.destination
    );


    startMusic();

    startBirds();

  } catch (error) {

    console.log(
      "Áudio indisponível",
      error
    );

  }

}


/* =========================================
   NOTA MUSICAL
========================================= */

const melody = [

  261.63,
  329.63,
  392.00,
  523.25,

  392.00,
  329.63,
  293.66,
  261.63,

  293.66,
  349.23,
  440.00,
  523.25,

  440.00,
  349.23,
  329.63,
  293.66

];

let melodyIndex = 0;


function playMusicNote(
  frequency,
  duration
) {

  if (
    !audioContext ||
    !musicGain ||
    !soundEnabled
  ) {
    return;
  }


  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type =
    "sine";

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0,
    audioContext.currentTime
  );

  gain.gain.linearRampToValueAtTime(
    0.07,
    audioContext.currentTime + .08
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime + duration
  );


  oscillator.connect(gain);

  gain.connect(musicGain);


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}


/* =========================================
   MÚSICA
========================================= */

function startMusic() {

  if (musicTimer) {
    return;
  }


  musicTimer =
    setInterval(
      () => {

        if (!soundEnabled) {
          return;
        }

        playMusicNote(
          melody[melodyIndex],
          1.6
        );

        melodyIndex =
          (melodyIndex + 1)
          % melody.length;

      },
      900
    );

}


/* =========================================
   PASSARINHO
========================================= */

function playBird() {

  if (
    !audioContext ||
    !ambienceGain ||
    !soundEnabled
  ) {
    return;
  }


  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  const now =
    audioContext.currentTime;


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    1750,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    2200,
    now + .13
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    1650,
    now + .27
  );


  gain.gain.setValueAtTime(
    0,
    now
  );

  gain.gain.linearRampToValueAtTime(
    .045,
    now + .03
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now + .32
  );


  oscillator.connect(gain);

  gain.connect(ambienceGain);


  oscillator.start(now);

  oscillator.stop(
    now + .35
  );

}


function startBirds() {

  if (birdTimer) {
    return;
  }


  birdTimer =
    setInterval(
      () => {

        if (
          soundEnabled &&
          Math.random() > .4
        ) {

          playBird();

        }

      },
      6500
    );

}


/* =========================================
   INICIAR JOGO
========================================= */

startButton.addEventListener(
  "click",
  () => {

    const typedName =
      nameInput.value.trim();


    if (typedName) {

      playerName =
        typedName;

    }


    playerNameElement.textContent =
      playerName;


    startScreen.classList.add(
      "hidden"
    );

    storyScreen.classList.add(
      "active"
    );


    currentScene = 0;

    affinity = 0;


    showScene();

    createAudio();


    if (
      audioContext &&
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  }
);

/* =========================================
   VOLUME DA MÚSICA
========================================= */

musicSlider.addEventListener(
  "input",
  () => {

    musicVolume =
      Number(musicSlider.value) / 100;


    musicValue.textContent =
      musicSlider.value + "%";


    if (musicGain) {

      musicGain.gain.value =
        soundEnabled
          ? musicVolume
          : 0;

    }

  }
);


/* =========================================
   VOLUME DO AMBIENTE
========================================= */

  () => {

    ambienceVolume =
      Number(ambienceSlider.value) / 100;


    ambienceValue.textContent =
      ambienceSlider.value + "%";

    }

  }
);


/* =========================================
   VOLUME DOS EFEITOS
========================================= */

effectsSlider.addEventListener(
  "input",
  () => {

    effectsVolume =
      Number(effectsSlider.value) / 100;


    effectsValue.textContent =
      effectsSlider.value + "%";


    if (effectsGain) {

      effectsGain.gain.value =
        soundEnabled
          ? effectsVolume
          : 0;

    }

  }
);


/* =========================================
   SILENCIAR
========================================= */

muteButton.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;


    if (musicGain) {

      musicGain.gain.value =
        soundEnabled
          ? musicVolume
          : 0;

    }


    if (ambienceGain) {

      ambienceGain.gain.value =
        soundEnabled
          ? ambienceVolume
          : 0;

    }


    if (effectsGain) {

      effectsGain.gain.value =
        soundEnabled
          ? effectsVolume
          : 0;

    }


    muteButton.textContent =
      soundEnabled
        ? "🔇 Silenciar tudo"
        : "🔊 Ativar sons";

  }
);
