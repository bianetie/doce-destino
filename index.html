<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#282137">

<title>Doce Destino</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Georgia,"Times New Roman",serif;
 color:#4b3948;
 background:#f8edf5;
}

button,input{
 font-family:inherit;
}


/* =====================================================
   TELAS
===================================================== */

#startScreen,#game{
 position:fixed;
 inset:0;
 overflow:hidden;
}

#startScreen{
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:
 radial-gradient(circle,#fff 0%,#f9e8f4 60%,#ead0e4 100%);
}

.startContent{
 width:88%;
 max-width:420px;
}

.heart{
 font-size:34px;
 color:#c99ab9;
 text-shadow:0 2px 10px #c99ab955;
}

.logo{
 font-size:40px;
 letter-spacing:2px;
 color:#79536d;
 text-shadow:0 2px 8px #79536d18;
}

.subtitle{
 font-size:14px;
 color:#9b718d;
 margin:8px 0 40px;
}

.startButton{
 padding:13px 30px;
 border:1px solid #c69bb8;
 border-radius:25px;
 background:linear-gradient(180deg,#fff,#f9edf5);
 color:#76516a;
 box-shadow:0 5px 18px #7e4c6e18,inset 0 1px 0 #fff;
}

#game{
 display:none;
}


/* =====================================================
   CENÁRIOS
===================================================== */

.scene{
 position:absolute;
 inset:0;
 overflow:hidden;
}

#cafe,#university{
 position:absolute;
 inset:0;
 background-position:center;
 background-size:cover;
 background-repeat:no-repeat;
 transition:opacity .55s ease;
}

#cafe{
 background-image:url("cafe-aurora-manha.png.PNG");
}

#university{
 display:none;
 background-image:url("universidade-aurora.png.PNG");
}


/* =====================================================
   TRANSIÇÃO
===================================================== */

#timeFade{
 position:absolute;
 inset:0;
 z-index:40;
 background:#fff;
 opacity:0;
 pointer-events:none;
 transition:opacity .45s ease;
}

#timeFade.active{
 opacity:1;
}


/* =====================================================
   HUD
===================================================== */

.hud{
 position:absolute;
 top:12px;
 left:12px;
 right:12px;
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 z-index:30;
 pointer-events:none;
}


/* =====================================================
   JOGADORA
===================================================== */

.playerCard{
 display:flex;
 align-items:center;
 gap:7px;
 padding:4px 11px 4px 4px;
 min-height:43px;
 border-radius:24px;
 background:linear-gradient(135deg,#fffdfef0,#f7eaf3e8);
 border:1px solid #fff;
 box-shadow:0 4px 14px #4a304318,inset 0 1px 0 #fff;
 backdrop-filter:blur(12px);
 color:#76516a;
 position:relative;
 overflow:hidden;
 pointer-events:auto;
 cursor:pointer;
 transition:transform .2s ease;
}

.playerCard:active{
 transform:scale(.97);
}

.avatar{
 width:33px;
 height:33px;
 flex-shrink:0;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(145deg,#fff,#f5e5ef);
 border:1px solid #d9b7cb;
 color:#b17f9c;
 font-size:17px;
 box-shadow:0 2px 7px #76516a18,inset 0 1px 2px #fff;
}

.playerInfo{
 display:flex;
 flex-direction:column;
 gap:0;
}

.playerMini{
 font-size:8px;
 letter-spacing:1px;
 text-transform:uppercase;
 color:#b08a9f;
}

.playerName{
 font-size:12px;
 color:#76516a;
 font-weight:bold;
}


/* =====================================================
   AFINIDADE
===================================================== */

.affinity{
 display:flex;
 align-items:center;
 gap:6px;
 min-height:43px;
 padding:5px 10px 5px 6px;
 border-radius:24px;
 background:linear-gradient(145deg,#fffdfef2,#f7eaf3e8);
 border:1px solid #fff;
 box-shadow:0 4px 14px #4a304318,inset 0 1px 0 #fff;
 backdrop-filter:blur(12px);
 color:#76516a;
}

.affinityHeart{
 width:31px;
 height:31px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:linear-gradient(145deg,#fff,#f3e2ed);
 border:1px solid #d9b7cb;
 color:#b77799;
 font-size:16px;
 box-shadow:0 2px 7px #76516a16,inset 0 1px 2px #fff;
}

.affinityInfo{
 display:flex;
 flex-direction:column;
 gap:0;
}

.affinityMini{
 font-size:7px;
 letter-spacing:.9px;
 text-transform:uppercase;
 color:#b08a9f;
}

.affinityValue{
 font-size:12px;
 color:#76516a;
 font-weight:bold;
}


/* =====================================================
   MENU
===================================================== */

#playerMenu{
 position:absolute;
 top:64px;
 left:12px;
 width:225px;
 padding:10px;
 z-index:55;
 display:none;
 border-radius:22px;
 background:linear-gradient(145deg,#fffdfef8,#f8edf5f5);
 border:1px solid #fff;
 box-shadow:0 10px 35px #4a304330,inset 0 1px 0 #fff;
 backdrop-filter:blur(16px);
}

#playerMenu.visible{
 display:block;
 animation:menuAppear .2s ease-out;
}

@keyframes menuAppear{
 from{
  opacity:0;
  transform:translateY(-5px) scale(.98);
 }
 to{
  opacity:1;
  transform:translateY(0) scale(1);
 }
}

.menuHeader{
 display:flex;
 align-items:center;
 gap:8px;
 padding:6px 8px 10px;
 border-bottom:1px solid #dcbfd033;
 color:#76516a;
}

.menuHeaderIcon{
 width:29px;
 height:29px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#fff;
 border:1px solid #d9b7cb;
 color:#b77799;
}

.menuHeaderText{
 display:flex;
 flex-direction:column;
}

.menuHeaderSmall{
 font-size:8px;
 letter-spacing:1px;
 text-transform:uppercase;
 color:#b08a9f;
}

.menuHeaderName{
 font-size:13px;
 font-weight:bold;
 color:#76516a;
}

.menuItems{
 display:flex;
 flex-direction:column;
 gap:5px;
 padding-top:8px;
}

.menuItem{
 width:100%;
 min-height:43px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:7px 9px;
 border:1px solid transparent;
 border-radius:15px;
 background:#ffffff80;
 color:#76516a;
 text-align:left;
 font-size:12px;
 transition:background .2s ease,transform .2s ease;
}

.menuItem:active{
 transform:scale(.98);
 background:#f9edf5;
}

.menuIcon{
 width:29px;
 height:29px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:linear-gradient(145deg,#fff,#f5e5ef);
 border:1px solid #dec2d2;
 font-size:13px;
}

.menuItemInfo{
 display:flex;
 flex-direction:column;
 gap:1px;
}

.menuItemTitle{
 font-size:12px;
 color:#76516a;
 font-weight:bold;
}

.menuItemSubtitle{
 font-size:9px;
 color:#aa8299;
}

.menuItem.disabled{
 opacity:.55;
}


/* =====================================================
   RELÓGIO
===================================================== */

.menuClock{
 margin-top:8px;
 padding:9px 10px;
 border-radius:15px;
 background:#f9edf580;
 border:1px solid #dcbfd044;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.menuClockLeft{
 display:flex;
 align-items:center;
 gap:8px;
}

.menuClockIcon{
 width:30px;
 height:30px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#fff;
 border:1px solid #d9b7cb;
 font-size:14px;
}

.menuClockText{
 display:flex;
 flex-direction:column;
}

.menuClockLabel{
 font-size:8px;
 letter-spacing:1px;
 text-transform:uppercase;
 color:#b08a9f;
}

.menuClockValue{
 font-size:13px;
 font-weight:bold;
 color:#76516a;
}


/* =====================================================
   CHILDE
===================================================== */

#childe{
 display:none;
 position:absolute;
 inset:0;
 z-index:12;
 pointer-events:none;
 overflow:hidden;
}

#childe.visible{
 display:block;
}


/*
   AS DUAS EXPRESSÕES FICAM SOBREPOSTAS.
   Isso permite fazer um fade suave entre elas.
*/

#childe img{
 position:absolute;
 height:95vh;
 width:auto;
 max-width:none;
 right:-18vw;
 bottom:-18vh;
 object-fit:contain;
 object-position:center bottom;

 filter:
  drop-shadow(0 12px 22px #3723324d)
  brightness(1.14)
  saturate(1.28)
  contrast(1.10);

 transform-origin:center bottom;

 animation:alive 4.2s ease-in-out infinite;

 opacity:0;

 transition:opacity .28s ease;
}

#childe img.active{
 opacity:1;
}

@keyframes alive{

 0%,100%{
  transform:translateY(0) rotate(0);
 }

 35%{
  transform:translate(-1px,-6px) rotate(.15deg);
 }

 60%{
  transform:translate(2px,-3px) rotate(.08deg);
 }
}


/* =====================================================
   BALÃO
===================================================== */

#bubble{
 display:none;
 position:absolute;
 right:3%;
 top:8%;
 width:min(42%,300px);
 padding:12px 15px;
 border-radius:20px 20px 6px 20px;
 background:#fff9fcf2;
 border:1px solid #fff;
 box-shadow:0 6px 22px #4a30431f;
 z-index:20;
}

#bubble.visible{
 display:block;
}

#bubble:after{
 content:"";
 position:absolute;
 left:28px;
 bottom:-10px;
 width:19px;
 height:19px;
 background:#fff9fcf2;
 transform:rotate(45deg);
 border-right:1px solid #fff;
 border-bottom:1px solid #fff;
}

.bubbleName{
 color:#966582;
 font-size:11px;
 font-weight:bold;
 margin-bottom:5px;
}

.bubbleText{
 font-size:13px;
 line-height:1.45;
}


/* =====================================================
   DIÁLOGO
===================================================== */

.bottom{
 position:absolute;
 left:12px;
 right:12px;
 bottom:12px;
 z-index:25;
}

.dialogue{
 min-height:92px;
 padding:13px 18px 21px;
 border:1px solid #ffffffdd;
 border-radius:20px;
 background:#fffafdD9;
 backdrop-filter:blur(13px);
 box-shadow:0 7px 28px #472e411f;
 cursor:pointer;
}

.speaker{
 color:#966582;
 font-size:12px;
 font-weight:bold;
 margin-bottom:6px;
}

.text{
 font-size:13.5px;
 line-height:1.52;
 min-height:45px;
}

.thought{
 background:#faf4fadd;
}

.thought .text{
 font-style:italic;
 color:#80657a;
}

.continue{
 position:absolute;
 right:17px;
 bottom:8px;
 color:#ad809b;
 font-size:11px;
 animation:pulse 1.7s ease-in-out infinite;
}

@keyframes pulse{
 50%{
  opacity:.4;
  transform:translateX(3px);
 }
}


/* =====================================================
   ESCOLHAS
===================================================== */

.choices{
 display:flex;
 flex-direction:column;
 gap:8px;
 margin-top:8px;
}

.choice{
 width:100%;
 padding:10px 14px;
 border:1px solid #c69bb880;
 border-radius:22px;
 background:#fffdfde8;
 color:#76516a;
 font-size:13px;
 box-shadow:0 5px 18px #7e4c6e12;
}

.choice:before{
 content:"♡";
 margin-right:8px;
 color:#bd8baa;
}

.restart{
 margin-top:8px;
 padding:9px 20px;
 border:1px solid #c69bb8;
 border-radius:22px;
 background:#fff;
 color:#76516a;
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

 .bottom{
  width:650px;
  left:50%;
  right:auto;
  transform:translateX(-50%);
 }

}

</style>

</head>

<body>

<script>


/* =====================================================
   SPRITES
===================================================== */

const sprites={

 alegre:
 "childe-alegre-transparente.png.PNG",

 franzindo:
 "childe-Franzindo a testa-transparente.png.PNG"

};


/* =====================================================
   PRÉ-CARREGAMENTO
===================================================== */

const spriteCache={};

function preloadSprites(){

 Object.entries(sprites).forEach(
  ([expression,src])=>{

   const img=new Image();

   img.decoding="async";

   img.src=src;

   spriteCache[expression]=img;

   if(typeof img.decode==="function"){

    img.decode().catch(()=>{});

   }

  }
);

}

preloadSprites();


/* =====================================================
   FUNDOS
===================================================== */

const backgrounds={

 cafe:{

  morning:
   "cafe-aurora-manha.png.PNG",

  afternoon:
   "cafe-aurora-tarde.png.PNG",

  night:
   "cafe-aurora-noite.png.PNG"

 },

 university:{

  morning:
   "universidade-aurora.png.PNG",

  afternoon:
   "universidade-aurora-tarde.png.PNG",

  night:
   "universidade-aurora-noite.png.PNG"

 }

};


/* =====================================================
   MEMÓRIA
===================================================== */

const memory={

 affinity:0,
 gentil:false,
 provocadora:false,
 distancia:false,
 hour:0,
 period:"night",
 place:"cafe",
 playerName:"Você",
 music:true

};


/* =====================================================
   ELEMENTOS
===================================================== */

const $=id=>document.getElementById(id);

const startScreen=$("startScreen");
const game=$("game");
const startButton=$("startButton");

const cafe=$("cafe");
const university=$("university");

const childe=$("childe");

const childeImgA=$("childeImgA");
const childeImgB=$("childeImgB");

const bubble=$("bubble");
const bubbleName=$("bubbleName");
const bubbleText=$("bubbleText");

const dialogue=$("dialogue");
const speaker=$("speaker");
const text=$("text");

const choices=$("choices");
const continueText=$("continue");

const affinityValue=$("affinityValue");

const clockIcon=$("menuClockIcon");
const clockTime=$("menuClockValue");

const playerCard=$("playerCard");
const playerMenu=$("playerMenu");

const playerName=$("playerName");
const menuPlayerName=$("menuPlayerName");

const musicMenuButton=$("musicMenuButton");
const musicMenuSubtitle=$("musicMenuSubtitle");

const timeFade=$("timeFade");


/* =====================================================
   CONTROLE DO CROSSFADE
===================================================== */

let activeChildeLayer=null;


/*
   Mostra o Childe pela primeira vez.
*/

function showChilde(expression="franzindo"){

 const selected=
  spriteCache[expression]||
  spriteCache.franzindo;


 if(!selected)
  return;


 /*
   Se ainda não existe nenhuma camada ativa,
   usamos a primeira diretamente.
 */

 if(!activeChildeLayer){

  childeImgA.src=selected.src;

  childeImgA.classList.add("active");

  activeChildeLayer="A";

  childe.classList.add("visible");

  return;

 }


 /*
   Descobrimos qual camada está visível
   e usamos a outra para fazer o fade.
 */

 const nextLayer=
  activeChildeLayer==="A"
   ? childeImgB
   : childeImgA;

 const currentLayer=
  activeChildeLayer==="A"
   ? childeImgA
   : childeImgB;


 /*
   Se for exatamente a mesma imagem,
   não precisamos fazer troca.
 */

 if(currentLayer.src===selected.src){

  childe.classList.add("visible");

  return;

 }


 /*
   Coloca a nova expressão na camada
   que está escondida.
 */

 nextLayer.src=
  selected.src;


 /*
   Garante que ela comece invisível.
 */

 nextLayer.classList.remove("active");


 /*
   Força o navegador a reconhecer
   o estado inicial antes do fade.
 */

 void nextLayer.offsetWidth;


 /*
   A nova expressão aparece
   enquanto a antiga desaparece.
 */

 nextLayer.classList.add("active");

 currentLayer.classList.remove("active");


 activeChildeLayer=
  activeChildeLayer==="A"
   ? "B"
   : "A";


 childe.classList.add("visible");

}


/*
   Esconde as duas camadas.
*/

function hideChilde(){

 childe.classList.remove("visible");

 childeImgA.classList.remove("active");
 childeImgB.classList.remove("active");

 bubble.classList.remove("visible");

 activeChildeLayer=null;

}


/* =====================================================
   PERÍODO
===================================================== */

function getPeriod(hour){

 if(hour>=6 && hour<12)
  return"morning";

 if(hour>=12 && hour<18)
  return"afternoon";

 return"night";

}


/* =====================================================
   ÍCONE
===================================================== */

function getPeriodIcon(period){

 if(period==="morning")
  return"🌅";

 if(period==="afternoon")
  return"☀️";

 return"🌙";

}


/* =====================================================
   TEMA DO NAVEGADOR
===================================================== */

function updateBrowserTheme(period){

 const meta=
  document.querySelector(
   'meta[name="theme-color"]'
  );

 if(!meta)
  return;

 if(period==="morning"){

  meta.content="#ead7e3";

 }

 else if(period==="afternoon"){

  meta.content="#e6d5d0";

 }

 else{

  meta.content="#282137";

 }

}


/* =====================================================
   RELÓGIO
===================================================== */

function updateRealClock(){

 const now=new Date();

 const hours=now.getHours();
 const minutes=now.getMinutes();

 const newPeriod=getPeriod(hours);
 const oldPeriod=memory.period;

 memory.hour=hours;
 memory.period=newPeriod;

 const formattedTime=
  String(hours).padStart(2,"0")
  +":"
  +String(minutes).padStart(2,"0");

 clockTime.textContent=
  formattedTime;

 clockIcon.textContent=
  getPeriodIcon(newPeriod);

 updateBrowserTheme(newPeriod);

 if(
  newPeriod!==oldPeriod &&
  game.style.display==="block"
 ){

  changeBackground(
   memory.place,
   newPeriod
  );

 }

}


/* =====================================================
   MUDAR FUNDO
===================================================== */

function changeBackground(place,period){

 const image=
  backgrounds[place][period];

 if(!image)
  return;

 timeFade.classList.add("active");

 setTimeout(()=>{

/* =====================================================
   MOTOR
===================================================== */

let current=null;


function showNode(id){

 const node=story[id];

 if(!node)
  return;

 current=node;

 choices.innerHTML="";

 continueText.style.display="none";


 if(node.place){

  applyPlace(node.place);

 }


 if(node.hide)
  hideChilde();


 if(node.expression){

  showChilde(node.expression);

 }


 if(node.type==="narration"){

  dialogue.classList.remove("thought");

  speaker.textContent="";

  text.textContent=node.text;

  hideBubble();

  continueText.style.display="block";

  return;

 }


 if(node.type==="thought"){

  dialogue.classList.add("thought");

  speaker.textContent="Pensamento";

  text.textContent=node.text;

  hideBubble();

  continueText.style.display="block";

  return;

 }


 if(node.type==="dialogue"){

  dialogue.classList.remove("thought");


  if(node.speaker==="Você"){

   speaker.textContent="Você";

   text.textContent=node.text;

   hideBubble();

  }

  else{

   speaker.textContent="";

   text.textContent="";

   showChilde(
    node.expression||"franzindo"
   );

   showBubble(
    node.speaker||"???",
    node.text
   );

  }


  continueText.style.display="block";

  return;

 }


 if(node.type==="choice"){

  dialogue.classList.remove("thought");

  speaker.textContent="";

  text.textContent=node.text;

  hideBubble();


  node.choices.forEach(c=>{

   const b=document.createElement("button");

   b.className="choice";

   b.textContent=c.text;

   b.onclick=e=>{

    e.stopPropagation();

    c.action();

    updateAffinity();

   };

   choices.appendChild(b);

  });

  return;

 }


 if(node.type==="branch"){

  showNode(
   node.condition()
  );

  return;

 }


 if(node.type==="end"){

  hideChilde();

  speaker.textContent="";

  text.textContent=node.text;


  const b=document.createElement("button");

  b.className="restart";

  b.textContent="Recomeçar";

  b.onclick=reset;

  choices.appendChild(b);

 }

}

 }

};
