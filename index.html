<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Doce Destino</title>

<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #100b18;
  color: white;

  font-family: Georgia, "Times New Roman", serif;
}

body {
  min-height: 100dvh;
}


/* =====================================================
   TELA DO JOGO
===================================================== */

.game {
  position: relative;

  width: 100%;
  height: 100dvh;

  overflow: hidden;

  background: #100b18;
}


/* =====================================================
   TELA INICIAL
===================================================== */

.start-screen {
  position: absolute;

  inset: 0;

  z-index: 100;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;

  text-align: center;

  background:
    radial-gradient(
      circle at center,
      rgba(125, 66, 120, 0.55),
      rgba(15, 8, 24, 0.98)
    );
}

.start-screen.hidden {
  display: none;
}

.start-title {
  margin: 0;

  font-size: clamp(42px, 11vw, 72px);

  letter-spacing: 2px;

  text-shadow:
    0 0 20px rgba(255, 190, 230, 0.45),
    0 3px 8px rgba(0,0,0,0.7);
}

.start-subtitle {
  margin-top: 8px;
  margin-bottom: 35px;

  font-size: 17px;

  color: #f5dced;

  font-style: italic;
}

.name-input {
  width: min(330px, 90vw);

  padding: 16px 20px;

  border-radius: 18px;

  border: 1px solid rgba(255,255,255,0.3);

  outline: none;

  background: rgba(35, 18, 43, 0.9);

  color: white;

  text-align: center;

  font-size: 17px;

  font-family: inherit;
}

.name-input::placeholder {
  color: rgba(255,255,255,0.6);
}

.start-button {
  margin-top: 18px;

  width: min(330px, 90vw);

  padding: 16px 20px;

  border: 0;
  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #9e548c,
      #6e386c
    );

  color: white;

  font-family: inherit;

  font-size: 18px;
  font-weight: bold;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.35);

  cursor: pointer;
}

.start-button:active {
  transform: scale(0.97);
}


/* =====================================================
   TELA DA HISTÓRIA
===================================================== */

.story-screen {
  position: absolute;

  inset: 0;

  display: none;

  overflow: hidden;

  background: #100b18;
}

.story-screen.active {
  display: block;
}


/* =====================================================
   CENÁRIO
===================================================== */

.scene {
  position: absolute;

  inset: 0;

  overflow: hidden;

  background: #151020;
}

.scene img {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 115%;
  height: 115%;

  max-width: none;

  object-fit: cover;

  transform-origin: center center;

  animation:
    auroraCamera 20s ease-in-out infinite alternate;
}


/* =====================================================
   MOVIMENTO DA CÂMERA
===================================================== */

@keyframes auroraCamera {

  0% {
    transform:
      translate(-50%, -50%)
      scale(1.02)
      translate3d(-0.4%, 0%, 0);
  }

  50% {
    transform:
      translate(-50%, -50%)
      scale(1.07)
      translate3d(0.5%, -0.4%, 0);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1.11)
      translate3d(-0.4%, 0.6%, 0);
  }
}


/* =====================================================
   ILUMINAÇÃO SOBRE O CENÁRIO
===================================================== */

.scene::after {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(8, 4, 16, 0.22),
      transparent 25%,
      transparent 60%,
      rgba(8, 3, 15, 0.68) 100%
    );
}


/* =====================================================
   CAMADA DE VENTO
===================================================== */

.wind-layer {
  position: absolute;

  inset: 0;

  z-index: 5;

  overflow: hidden;

  pointer-events: none;
}


/* =====================================================
   PÉTALAS / FOLHAS
===================================================== */

.leaf {
  position: absolute;

  width: 13px;
  height: 8px;

  border-radius:
    100% 0 100% 0;

  background:
    rgba(255, 194, 220, 0.92);

  box-shadow:
    0 0 5px rgba(255,255,255,0.3);

  animation:
    windLeaf linear infinite;

  opacity: 0;
}


/* posições diferentes */

.leaf:nth-child(1) {
  left: 3%;
  top: 15%;
  animation-duration: 6s;
  animation-delay: -1s;
}

.leaf:nth-child(2) {
  left: 18%;
  top: 25%;
  animation-duration: 8s;
  animation-delay: -4s;
}

.leaf:nth-child(3) {
  left: 31%;
  top: 10%;
  animation-duration: 7s;
  animation-delay: -2s;
}

.leaf:nth-child(4) {
  left: 46%;
  top: 20%;
  animation-duration: 9s;
  animation-delay: -6s;
}

.leaf:nth-child(5) {
  left: 61%;
  top: 13%;
  animation-duration: 7.5s;
  animation-delay: -3s;
}

.leaf:nth-child(6) {
  left: 76%;
  top: 28%;
  animation-duration: 10s;
  animation-delay: -7s;
}

.leaf:nth-child(7) {
  left: 90%;
  top: 17%;
  animation-duration: 6.5s;
  animation-delay: -2s;
}

.leaf:nth-child(8) {
  left: 12%;
  top: 42%;
  animation-duration: 11s;
  animation-delay: -8s;
}

.leaf:nth-child(9) {
  left: 54%;
  top: 37%;
  animation-duration: 8.5s;
  animation-delay: -5s;
}

.leaf:nth-child(10) {
  left: 84%;
  top: 45%;
  animation-duration: 9.5s;
  animation-delay: -3s;
}


@keyframes windLeaf {

  0% {
    transform:
      translate3d(-30px, -20px, 0)
      rotate(0deg);

    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  30% {
    transform:
      translate3d(80px, 50px, 0)
      rotate(100deg);
  }

  55% {
    transform:
      translate3d(190px, 20px, 0)
      rotate(220deg);
  }

  75% {
    transform:
      translate3d(290px, 100px, 0)
      rotate(320deg);
  }

  100% {
    transform:
      translate3d(430px, 150px, 0)
      rotate(480deg);

    opacity: 0;
  }
}


/* =====================================================
   EFEITO DA ÁGUA
===================================================== */

.water-effect {

  position: absolute;

  left: 50%;
  top: 76%;

  width: 190px;
  height: 60px;

  transform:
    translate(-50%, -50%);

  z-index: 6;

  pointer-events: none;
}


.ripple {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 35px;
  height: 10px;

  transform:
    translate(-50%, -50%);

  border:
    2px solid rgba(255,255,255,0.48);

  border-radius: 50%;

  animation:
    rippleWater 3s ease-out infinite;
}


.ripple:nth-child(2) {
  animation-delay: 1s;
}

.ripple:nth-child(3) {
  animation-delay: 2s;
}


@keyframes rippleWater {

  0% {
    width: 20px;
    height: 7px;

    opacity: 0.8;
  }

  100% {
    width: 170px;
    height: 45px;

    opacity: 0;
  }
}


/* =====================================================
   BRILHO DA ÁGUA
===================================================== */

.water-shimmer {

  position: absolute;

  left: 50%;
  top: 73%;

  width: 140px;
  height: 5px;

  transform:
    translateX(-50%);

  z-index: 7;

  pointer-events: none;

  background:
    rgba(255,255,255,0.38);

  filter: blur(3px);

  animation:
    waterShimmer 2.4s ease-in-out infinite;
}


@keyframes waterShimmer {

  0%,
  100% {
    transform:
      translateX(-70%)
      scaleX(0.5);

    opacity: 0.15;
  }

  50% {
    transform:
      translateX(-30%)
      scaleX(1.25);

    opacity: 0.75;
  }
}


/* =====================================================
   HUD SUPERIOR
===================================================== */

.hud {

  position: absolute;

  top: 18px;
  left: 20px;
  right: 20px;

  z-index: 20;

  display: flex;

  align-items: center;

  justify-content: space-between;
}


/* =====================================================
   JOGADOR
===================================================== */

.player-info {

  display: flex;

  align-items: center;

  gap: 10px;
}


.player-avatar {

  width: 64px;
  height: 64px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 50%;

  border:
    2px solid rgba(255,255,255,0.65);

  background:
    linear-gradient(
      145deg,
      #b968a5,
      #7d447c
    );

  box-shadow:
    0 4px 15px rgba(0,0,0,0.35);

  color: white;

  font-size: 31px;
}


.player-name {

  font-size: 25px;

  font-weight: bold;

  text-shadow:
    0 2px 7px rgba(0,0,0,0.9);
}


/* =====================================================
   AFINIDADE
===================================================== */

.affinity {

  display: flex;

  align-items: center;

  gap: 7px;

  padding: 11px 15px;

  border-radius: 22px;

  background:
    rgba(42, 23, 48, 0.78);

  border:
    1px solid rgba(255,255,255,0.18);

  box-shadow:
    0 5px 18px rgba(0,0,0,0.3);

  font-size: 17px;
}

.affinity-heart {
  font-size: 23px;
}


/* =====================================================
   ÁREA INFERIOR
===================================================== */

.bottom-area {

  position: absolute;

  left: 20px;
  right: 20px;
  bottom: 18px;

  z-index: 20;
}


/* =====================================================
   CAIXA DE DIÁLOGO
===================================================== */

.dialogue-box {

  padding:
    22px 25px;

  border-radius:
    25px;

  background:
    rgba(18, 10, 25, 0.91);

  border:
    1px solid rgba(255,255,255,0.22);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.4);

  backdrop-filter:
    blur(5px);

  -webkit-backdrop-filter:
    blur(5px);
}


.dialogue-text {

  margin: 0;

  font-size:
    clamp(18px, 4.8vw, 23px);

  line-height: 1.45;

  color: #fff;
}


/* =====================================================
   ESCOLHAS
===================================================== */

.choices {

  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-top: 12px;
}


.choice-button {

  width: 100%;

  padding:
    15px 20px;

  border-radius:
    18px;

  border:
    1px solid rgba(255,255,255,0.2);

  background:
    linear-gradient(
      135deg,
      rgba(143, 72, 126, 0.93),
      rgba(86, 43, 83, 0.95)
    );

  color: white;

  text-align: left;

  font-family: inherit;

  font-size:
    clamp(15px, 4vw, 18px);

  line-height: 1.25;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.3);

  cursor: pointer;

  transition:
    transform 0.15s ease,
    filter 0.15s ease;
}

.choice-button:active {

  transform:
    scale(0.98);

  filter:
    brightness(1.15);
}


/* =====================================================
   BOTÃO DE SOM
===================================================== */

.sound-button {

  position: absolute;

  right: 18px;
  bottom: 180px;

  z-index: 30;

  width: 45px;
  height: 45px;

  border-radius: 50%;

  border:
    1px solid rgba(255,255,255,0.25);

  background:
    rgba(28, 17, 35, 0.8);

  color: white;

  font-size: 21px;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.35);
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-height: 700px) {

  .hud {
    top: 10px;
  }

  .player-avatar {
    width: 52px;
    height: 52px;
    font-size: 25px;
  }

  .player-name {
    font-size: 21px;
  }

  .affinity {
    padding: 8px 11px;
  }

  .bottom-area {
    bottom: 10px;
  }

  .dialogue-box {
    padding: 16px 18px;
  }

  .dialogue-text {
    font-size: 17px;
  }

  .choice-button {
    padding: 12px 16px;
    font-size: 15px;
  }

  .sound-button {
    bottom: 165px;
  }
}

</style>
</head>


<body>

<div class="game">


  <!-- =================================================
       TELA INICIAL
  ================================================== -->

  <section
    id="startScreen"
    class="start-screen"
  >

    <h1 class="start-title">
      Doce Destino
    </h1>

    <p class="start-subtitle">
      Seu coração escolhe o caminho.
    </p>

    <input
      id="nameInput"
      class="name-input"
      type="text"
      maxlength="20"
      placeholder="Digite seu nome..."
      autocomplete="off"
    >

    <button
      id="startButton"
      class="start-button"
    >
      Começar minha história 💗
    </button>

  </section>


  <!-- =================================================
       HISTÓRIA
  ================================================== -->

  <section
    id="storyScreen"
    class="story-screen"
  >


    <!-- =================================================
         CENÁRIO
    ================================================== -->

    <div class="scene">

      <img
        src="universidade-aurora.png.PNG"
        alt="Universidade Aurora"
      >


      <!-- PÉTALAS -->

      <div class="wind-layer">

        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>

      </div>


      <!-- ÁGUA -->

      <div class="water-effect">

        <span class="ripple"></span>
        <span class="ripple"></span>
        <span class="ripple"></span>

      </div>


      <div class="water-shimmer"></div>

    </div>


    <!-- =================================================
         HUD
    ================================================== -->

    <div class="hud">

      <div class="player-info">

        <div
          id="playerAvatar"
          class="player-avatar"
        >
          ♡
        </div>

        <div
          id="playerName"
          class="player-name"
        >
          Bia
        </div>

      </div>


      <div class="affinity">

        <span class="affinity-heart">
          ❤️
        </span>

        <span id="affinityValue">
          0
        </span>

      </div>

    </div>


    <!-- =================================================
         BOTÃO DE SOM
    ================================================== -->

    <button
      id="soundButton"
      class="sound-button"
      aria-label="Som"
    >
      🔊
    </button>


    <!-- =================================================
         PARTE INFERIOR
    ================================================== -->

    <div class="bottom-area">


      <div class="dialogue-box">

        <p
          id="dialogueText"
          class="dialogue-text"
        ></p>

      </div>


      <div
        id="choices"
        class="choices"
      ></div>


    </div>


  </section>

</div>


<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let playerName = "Bia";

let affinity = 0;

let currentScene = 0;

let soundEnabled = true;

let audioContext = null;

let musicTimer = null;

let birdTimer = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
  document.getElementById("startScreen");

const storyScreen =
  document.getElementById("storyScreen");

const nameInput =
  document.getElementById("nameInput");

const startButton =
  document.getElementById("startButton");

const playerNameElement =
  document.getElementById("playerName");

const affinityElement =
  document.getElementById("affinityValue");

const dialogueText =
  document.getElementById("dialogueText");

const choicesElement =
  document.getElementById("choices");

const soundButton =
  document.getElementById("soundButton");


/* =====================================================
   HISTÓRIA
===================================================== */

const story = [

  {
    text:
      "Seu primeiro dia na Universidade Aurora finalmente chegou. {name}, você respira fundo antes de entrar no campus.",

    choices: [

      {
        text: "Entrar imediatamente.",
        affinity: 1,
        next: 1
      },

      {
        text: "Parar por alguns segundos e observar.",
        affinity: 2,
        next: 1
      }

    ]
  },


  {
    text:
      "A brisa passa suavemente pelo jardim. Pétalas rosadas atravessam seu campo de visão enquanto a água da fonte dança ao longe.",

    choices: [

      {
        text: "Sorrir e continuar caminhando.",
        affinity: 1,
        next: 2
      },

      {
        text: "Observar a universidade com atenção.",
        affinity: 2,
        next: 2
      }

    ]
  },


  {
    text:
      "Há algo naquele lugar que faz seu coração bater um pouco mais rápido. Talvez seja apenas a ansiedade de começar uma nova vida.",

    choices: [

      {
        text: "Pensar no futuro.",
        affinity: 1,
        next: 3
      },

      {
        text: "Deixar o momento simplesmente acontecer.",
        affinity: 2,
        next: 3
      }

    ]
  },


  {
    text:
      "Você atravessa os portões da Universidade Aurora. O som distante dos pássaros acompanha seus primeiros passos pelo campus.",

    choices: [

      {
        text: "Continuar explorando.",
        affinity: 1,
        next: 4
      },

      {
        text: "Procurar alguém para conversar.",
        affinity: 2,
        next: 4
      }

    ]
  },


  {
    text:
      "Então, entre os estudantes que atravessam o jardim, uma presença chama sua atenção.",

    choices: [

      {
        text: "Olhar discretamente.",
        affinity: 2,
        next: 5
      },

      {
        text: "Desviar o olhar.",
        affinity: 1,
        next: 5
      }

    ]
  },


  {
    text:
      "Por alguns segundos, seus olhares parecem se encontrar. Você ainda não sabe, mas aquele momento será o começo de algo importante.",

    choices: [

      {
        text: "Sustentar o olhar.",
        affinity: 2,
        next: 6
      },

      {
        text: "Continuar andando.",
        affinity: 1,
        next: 6
      }

    ]
  },


  {
    text:
      "Um novo capítulo começa. E talvez seu coração já saiba que essa universidade guarda muito mais do que você imaginava.",

    choices: [

      {
        text: "Continuar.",
        affinity: 2,
        next: 0
      }

    ]
  }

];


/* =====================================================
   MOSTRAR CENA
===================================================== */

function showScene() {

  const scene =
    story[currentScene];

  let text =
    scene.text.replace(
      "{name}",
      playerName
    );

  dialogueText.textContent = text;

  affinityElement.textContent =
    affinity;

  choicesElement.innerHTML = "";


  scene.choices.forEach(
    (choice) => {

      const button =
        document.createElement("button");

      button.className =
        "choice-button";

      button.textContent =
        choice.text;

      button.addEventListener(
        "click",
        () => {

          affinity +=
            choice.affinity || 0;

          currentScene =
            choice.next;

          showScene();

        }
      );

      choicesElement.appendChild(
        button
      );

    }
  );
}


/* =====================================================
   INICIAR JOGO
===================================================== */

startButton.addEventListener(
  "click",
  () => {

    const typedName =
      nameInput.value.trim();

    if (typedName.length > 0) {
      playerName =
        typedName;
    }

    playerNameElement.textContent =
      playerName;

    startScreen.classList.add(
      "hidden"
    );

    storyScreen.classList.add(
      "active"
    );

    currentScene = 0;

    affinity = 0;

    showScene();

    startAudio();

  }
);


/* =====================================================
   ÁUDIO
   Música instrumental ORIGINAL
===================================================== */

function startAudio() {

  if (audioContext) {
    return;
  }

  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if (
      audioContext.state ===
      "suspended"
    ) {
      audioContext.resume();
    }

    startMusic();

    startBirds();

    soundButton.textContent =
      "🔊";

  } catch (error) {

    console.log(
      "Áudio não disponível:",
      error
    );

  }

}


/* =====================================================
   CRIAR NOTA MUSICAL
===================================================== */

function playNote(
  frequency,
  duration,
  volume = 0.035
) {

  if (
    !audioContext ||
    !soundEnabled
  ) {
    return;
  }


  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type =
    "sine";

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0,
    audioContext.currentTime
  );

  gain.gain.linearRampToValueAtTime(
    volume,
    audioContext.currentTime + 0.05
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duration
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}


/* =====================================================
   MELODIA
===================================================== */

const melody = [

  261.63,
  329.63,
  392.00,
  523.25,

  392.00,
  329.63,
  293.66,
  261.63,

  293.66,
  349.23,
  440.00,
  523.25,

  440.00,
  349.23,
  329.63,
  293.66

];


let melodyIndex = 0;


function startMusic() {

  if (!audioContext) {
    return;
  }


  if (musicTimer) {
    return;
  }


  musicTimer =
    setInterval(
      () => {

        if (
          !soundEnabled
        ) {
          return;
        }

        playNote(
          melody[melodyIndex],
          1.7,
          0.025
        );

        melodyIndex++;

        if (
          melodyIndex >=
          melody.length
        ) {

          melodyIndex = 0;

        }

      },
      900
    );

}


/* =====================================================
   SOM DE PASSARINHOS
===================================================== */

function birdSound() {

  if (
    !audioContext ||
    !soundEnabled
  ) {
    return;
  }


  const now =
    audioContext.currentTime;


  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    1600,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    2200,
    now + 0.13
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    1500,
    now + 0.26
  );


  gain.gain.setValueAtTime(
    0,
    now
  );

  gain.gain.linearRampToValueAtTime(
    0.025,
    now + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.32
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start(now);

  oscillator.stop(
    now + 0.35
  );


  setTimeout(
    () => {

      if (soundEnabled) {

        playNote(
          1900,
          0.22,
          0.018
        );

      }

    },
    180
  );

}


function startBirds() {

  if (birdTimer) {
    return;
  }


  birdTimer =
    setInterval(
      () => {

        if (
          soundEnabled &&
          Math.random() > 0.35
        ) {

          birdSound();

        }

      },
      5000
    );

}


/* =====================================================
   BOTÃO DE SOM
===================================================== */

soundButton.addEventListener(
  "click",
  async () => {

    soundEnabled =
      !soundEnabled;


    if (
      audioContext &&
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    soundButton.textContent =
      soundEnabled
        ? "🔊"
        : "🔇";

  }
);

</script>
