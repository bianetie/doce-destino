<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doce Destino</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
  color:#4b3948;
  background:#f8edf5;
}

/* =========================
   CHILDE — MAIS VIVO
========================= */

.childe-layer{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:-1%;
  bottom:12%;
  z-index:12;
  pointer-events:none;
  align-items:flex-end;
  justify-content:flex-end;
  overflow:visible;
}

.childe-layer.visible{
  display:flex;
}

.childe-sprite{
  height:142%;
  width:auto;
  max-width:78%;
  object-fit:contain;
  object-position:center bottom;

  filter:
    drop-shadow(0 10px 18px rgba(55,35,50,.24))
    brightness(1.08)
    saturate(1.10)
    contrast(1.04);

  transform-origin:center bottom;

  animation:
    childeAlive 4.2s ease-in-out infinite;

  will-change:transform;
}

@keyframes childeAlive{

  0%,100%{
    transform:
      translate3d(0,0,0)
      rotate(0deg)
      scale(1);
  }

  18%{
    transform:
      translate3d(-1px,-3px,0)
      rotate(-.15deg)
      scale(1.006);
  }

  38%{
    transform:
      translate3d(1px,-7px,0)
      rotate(.18deg)
      scale(1.012);
  }

  58%{
    transform:
      translate3d(2px,-4px,0)
      rotate(.08deg)
      scale(1.008);
  }

  78%{
    transform:
      translate3d(-1px,-2px,0)
      rotate(-.12deg)
      scale(1.004);
  }
}

/* entrada do personagem */

.childe-layer.visible .childe-sprite{
  animation:
    childeEnter .55s cubic-bezier(.2,.8,.2,1) both,
    childeAlive 4.2s ease-in-out .55s infinite;
}

@keyframes childeEnter{

  from{
    opacity:0;
    transform:
      translate3d(34px,18px,0)
      scale(.92);
  }

  to{
    opacity:1;
    transform:
      translate3d(0,0,0)
      scale(1);
  }
}
