<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Doce Destino</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Georgia,"Times New Roman",serif;
background:#f8edf5;
color:#4b3948
}

button{
font-family:inherit
}

/* =========================
   TELA INICIAL
========================= */

.start-screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
radial-gradient(
circle at 50% 35%,
rgba(255,255,255,.96),
rgba(249,232,244,.97) 55%,
rgba(235,211,230,.99)
);
z-index:20
}

.start-content{
width:88%;
max-width:420px
}

.start-decoration{
font-size:30px;
color:#c79ab8;
margin-bottom:18px
}

.logo{
font-size:42px;
font-weight:500;
letter-spacing:2px;
color:#79536d;
margin-bottom:8px
}

.subtitle{
font-size:14px;
letter-spacing:1px;
color:#9b718d;
margin-bottom:45px
}

.start-button,
.choice-button,
.restart-button,
.mute-button{
border:1px solid rgba(159,111,143,.5);
background:rgba(255,255,255,.72);
color:#76516a;
border-radius:22px;
box-shadow:0 5px 18px rgba(126,76,110,.10);
transition:.2s
}

.start-button{
padding:13px 34px;
font-size:15px
}

.start-button:active,
.choice-button:active,
.restart-button:active,
.mute-button:active{
transform:scale(.98)
}

/* =========================
   HISTÓRIA
========================= */

.story-screen{
display:none;
position:fixed;
inset:0;
overflow:hidden;
background:#dce9e4
}

.scene{
position:absolute;
inset:0;
overflow:hidden
}

.scene img{
width:115%;
height:115%;
object-fit:cover;
position:absolute;
left:-7.5%;
top:-7.5%;
animation:auroraCamera 18s ease-in-out infinite alternate
}

@keyframes auroraCamera{
from{
transform:scale(1)
}
to{
transform:scale(1.06) translate(-1%,-.7%)
}
}

/* =========================
   FOLHAS
========================= */

.wind-layer{
position:absolute;
inset:0;
pointer-events:none;
overflow:hidden
}

.leaf{
position:absolute;
width:9px;
height:5px;
border-radius:100% 0 100% 0;
background:rgba(255,244,250,.7);
animation:windLeaf linear infinite
}

.leaf:nth-child(1){
left:5%;
top:20%;
animation-duration:8s
}

.leaf:nth-child(2){
left:32%;
top:8%;
animation-duration:10s;
animation-delay:2s
}

.leaf:nth-child(3){
left:65%;
top:18%;
animation-duration:7s;
animation-delay:1s
}

.leaf:nth-child(4){
left:85%;
top:28%;
animation-duration:11s;
animation-delay:3s
}

@keyframes windLeaf{
0%{
transform:translate(-20px,-20px) rotate(0);
opacity:0
}

15%{
opacity:.8
}

100%{
transform:translate(150px,90vh) rotate(360deg);
opacity:0
}
}

/* =========================
   ÁGUA
========================= */

.water-effect{
position:absolute;
left:0;
right:0;
bottom:0;
height:28%;
pointer-events:none;
overflow:hidden;
opacity:.45
}

.ripple{
position:absolute;
width:160px;
height:40px;
border:1px solid rgba(255,255,255,.55);
border-radius:50%;
animation:rippleWater 4s ease-out infinite
}

.ripple:nth-child(1){
left:20%;
bottom:28%
}

.ripple:nth-child(2){
left:58%;
bottom:17%;
animation-delay:1.8s
}

.water-shimmer{
position:absolute;
inset:0;
background:
linear-gradient(
105deg,
transparent 30%,
rgba(255,255,255,.15) 45%,
transparent 60%
);
animation:waterShimmer 5s linear infinite
}

@keyframes rippleWater{
0%{
transform:scale(.3);
opacity:0
}

25%{
opacity:.8
}

100%{
transform:scale(1.8);
opacity:0
}
}

@keyframes waterShimmer{
from{
transform:translateX(-100%)
}
to{
transform:translateX(100%)
}
}

/* =========================
   HUD
========================= */

.hud{
position:absolute;
top:15px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:8
}

.player-card,
.affinity,
.sound-button{
border:1px solid rgba(255,255,255,.65);
background:rgba(255,255,255,.55);
backdrop-filter:blur(8px);
box-shadow:0 3px 14px rgba(80,50,70,.1)
}

.player-card{
display:flex;
align-items:center;
gap:8px;
padding:6px 11px 6px 7px;
border-radius:30px
}

.player-avatar{
width:32px;
height:32px;
border-radius:50%;
background:rgba(255,255,255,.8);
border:1px solid rgba(160,120,145,.35);
display:flex;
align-items:center;
justify-content:center;
color:#a47792;
font-size:17px
}

.player-name{
font-size:13px;
color:#684d60
}

.affinity{
padding:7px 11px;
border-radius:20px;
color:#76516a;
font-size:12px
}

/* =========================
   SOM
========================= */

.sound-button{
position:absolute;
right:15px;
top:61px;
z-index:10;
width:36px;
height:36px;
border-radius:50%;
color:#76516a;
font-size:16px
}

.audio-panel{
display:none;
position:absolute;
right:15px;
top:105px;
z-index:11;
width:205px;
padding:15px;
border-radius:18px;
border:1px solid rgba(255,255,255,.7);
background:rgba(255,248,252,.9);
backdrop-filter:blur(12px);
box-shadow:0 8px 25px rgba(80,50,70,.16)
}

.audio-row{
margin-bottom:12px
}

.audio-row label{
display:block;
font-size:11px;
color:#76516a;
margin-bottom:5px
}

.audio-row input{
width:100%
}

.mute-button{
padding:6px 12px;
font-size:11px
}

/* =========================
   CHILDE
========================= */

.childe-layer{
display:none;
position:absolute;
inset:0;
z-index:4;
pointer-events:none;
align-items:center;
justify-content:center
}

.childe-card{
position:relative;
height:min(68vh,610px);
width:min(58vw,390px);
min-width:250px;
display:flex;
align-items:flex-end;
justify-content:center;
overflow:hidden;
border-radius:26px;
border:1px solid rgba(255,255,255,.72);
background:rgba(255,248,252,.22);
box-shadow:0 12px 35px rgba(50,35,50,.22);
backdrop-filter:blur(2px)
}

.childe-card img{
width:100%;
height:100%;
object-fit:cover;
object-position:center top;
animation:childeIdle 3.8s ease-in-out infinite
}

@keyframes childeIdle{
0%,100%{
transform:translateY(0)
}
50%{
transform:translateY(-4px)
}
}

.childe-nameplate{
position:absolute;
top:10px;
left:12px;
padding:5px 11px;
border-radius:14px;
background:rgba(255,250,253,.78);
border:1px solid rgba(255,255,255,.7);
font-size:11px;
color:#684d60;
backdrop-filter:blur(8px)
}

.expression-note{
position:absolute;
right:12px;
top:10px;
font-size:10px;
color:#76516a;
background:rgba(255,250,253,.72);
padding:4px 8px;
border-radius:12px
}

.childe-active .wind-layer,
.childe-active .water-effect{
opacity:.15
}

.childe-active .scene img{
animation:none;
filter:brightness(.9) saturate(.9)
}

/* =========================
   DIÁLOGO
========================= */

.bottom-area{
position:absolute;
left:0;
right:0;
bottom:0;
padding:0 12px 12px;
z-index:12
}

.dialogue-box{
position:relative;
width:100%;
min-height:115px;
max-height:30vh;
padding:18px 20px 25px;
border:1px solid rgba(255,255,255,.82);
border-radius:20px;
background:rgba(255,250,253,.86);
backdrop-filter:blur(13px);
box-shadow:
0 7px 28px rgba(71,46,65,.18),
inset 0 1px rgba(255,255,255,.7);
cursor:pointer;
touch-action:manipulation
}

.dialogue-box:active{
transform:scale(.997)
}

.dialogue-speaker{
font-size:11px;
letter-spacing:.4px;
color:#9b718d;
margin-bottom:5px
}

.dialogue-text{
font-size:14px;
line-height:1.58;
color:#4d3c49;
min-height:70px
}

.tap-indicator{
position:absolute;
right:15px;
bottom:8px;
color:#a77b97;
font-size:18px;
animation:tapPulse 1.5s ease-in-out infinite
}

@keyframes tapPulse{
0%,100%{
opacity:.35;
transform:translateX(0)
}

50%{
opacity:1;
transform:translateX(4px)
}
}

/* =========================
   ESCOLHAS
========================= */

.choice-area{
display:flex;
flex-direction:column;
gap:8px;
margin-top:9px
}

.choice-button{
width:100%;
padding:10px 14px;
font-size:13px;
line-height:1.3
}

.restart-button{
padding:9px 20px;
font-size:12px;
margin-top:8px
}

@media(min-width:700px){

.bottom-area{
left:50%;
transform:translateX(-50%);
width:650px
}

.hud{
left:25px;
right:25px
}

.sound-button{
right:25px
}

.audio-panel{
right:25px
}
}

@media(max-height:700px){

.childe-card{
height:55vh
}

.dialogue-box{
min-height:100px;
padding-top:13px
}

.dialogue-text{
font-size:13px;
min-height:55px
}
}
</style>
</head>

<body>

<!-- =========================
     TELA INICIAL
========================= -->

<div class="start-screen" id="startScreen">

<div class="start-content">

<div class="start-decoration">♡</div>

<div class="logo">
Doce Destino
</div>

<div class="subtitle">
Seu coração escolhe o caminho.
</div>

<button class="start-button" id="startButton">
Começar minha história
</button>

</div>

</div>


<!-- =========================
     HISTÓRIA
========================= -->

<div class="story-screen" id="storyScreen">

<div class="scene">

<img
id="sceneImage"
src="universidade-aurora.png.PNG"
alt="Universidade Aurora">

</div>


<div class="wind-layer">

<span class="leaf"></span>
<span class="leaf"></span>
<span class="leaf"></span>
<span class="leaf"></span>

</div>


<div class="water-effect">

<div class="ripple"></div>
<div class="ripple"></div>
<div class="water-shimmer"></div>

</div>


<!-- CHILDE -->

<div class="childe-layer" id="childeLayer">

<div class="childe-card">

<img
id="childeImage"
src="childe-franzindo.png"
alt="Childe">

<div class="childe-nameplate">
Childe
</div>

<div
class="expression-note"
id="expressionNote">
observando
</div>

</div>

</div>


<!-- HUD -->

<div class="hud">

<div class="player-card">

<div class="player-avatar">
♡
</div>

<div
class="player-name"
id="playerName">
Você
</div>

</div>


<div
class="affinity"
id="affinity">
♡ Afinidade 0
</div>

</div>


<!-- SOM -->

<button
class="sound-button"
id="soundButton">
♫
</button>


<div
class="audio-panel"
id="audioPanel">

<div class="audio-row">

<label>
Música
</label>

<input
type="range"
id="musicVolume"
min="0"
max="1"
step=".01"
value=".35">

</div>


<div class="audio-row">

<label>
Ambiente
</label>

<input
type="range"
id="ambientVolume"
min="0"
max="1"
step=".01"
value=".10">

</div>


<div class="audio-row">

<label>
Efeitos
</label>

<input
type="range"
id="effectVolume"
min="0"
max="1"
step=".01"
value=".35">

</div>


<button
class="mute-button"
id="muteButton">
Silenciar
</button>

</div>


<!-- DIÁLOGO -->

<div class="bottom-area">

<div
class="dialogue-box"
id="dialogueBox">

<div
class="dialogue-speaker"
id="dialogueSpeaker">
</div>

<div
class="dialogue-text"
id="dialogueText">
</div>

<div
class="tap-indicator"
id="tapIndicator">
›
</div>

</div>


<div
class="choice-area"
id="choiceArea">
</div>

</div>

</div>


<script>

/* =========================
   MEMÓRIA
========================= */

const memory = {

conversouComEstranho:false,

observouUniversidade:false,

entrouImediatamente:false,

perguntouNome:false,

seguiuSozinhaDepois:false,

affinity:0,

childeExpression:"franzindo"

};


/* =========================
   ELEMENTOS
========================= */

const startScreen =
document.getElementById("startScreen");

const storyScreen =
document.getElementById("storyScreen");

const startButton =
document.getElementById("startButton");

const dialogueBox =
document.getElementById("dialogueBox");

const dialogueText =
document.getElementById("dialogueText");

const dialogueSpeaker =
document.getElementById("dialogueSpeaker");

const choiceArea =
document.getElementById("choiceArea");

const tapIndicator =
document.getElementById("tapIndicator");

const affinityDisplay =
document.getElementById("affinity");

const sceneImage =
document.getElementById("sceneImage");

const childeLayer =
document.getElementById("childeLayer");

const childeImage =
document.getElementById("childeImage");

const expressionNote =
document.getElementById("expressionNote");


/* =========================
   EXPRESSÕES DO CHILDE
========================= */

const sprites = {

franzindo:
"childe-franzindo.png",

sorrindo:
"childe-sorrindo.png",

raiva:
"childe-raiva.png",

decepcionado:
"childe-decepcionado.png"

};


/*
Se depois colocarmos as versões
transparentes no GitHub, o jogo
vai tentar usá-las automaticamente.
*/

const transparentSprites = {

franzindo:
"childe-franzindo-transparente.png",

sorrindo:
"childe-sorrindo-transparente.png",

raiva:
"childe-raiva-transparente.png",

decepcionado:
"childe-decepcionado-transparente.png"

};


function setChilde(expression){

memory.childeExpression =
expression;

childeLayer.style.display =
"flex";

document.body.classList.add(
"childe-active"
);

expressionNote.textContent = {

franzindo:"observando",

sorrindo:"sorrindo",

raiva:"irritado",

decepcionado:"decepcionado"

}[expression];


const transparent =
transparentSprites[expression];

const normal =
sprites[expression];


const test =
new Image();


test.onload = function(){

childeImage.src =
transparent;

};


test.onerror = function(){

childeImage.src =
normal;

};


test.src =
transparent;

}


function hideChilde(){

childeLayer.style.display =
"none";

document.body.classList.remove(
"childe-active"
);

}


/* =========================
   ÁUDIO
========================= */

let audioContext =
null;

let musicGain =
null;

let ambientGain =
null;

let effectGain =
null;

let musicStarted =
false;

let muted =
false;


function initAudio(){

if(audioContext)
return;

audioContext =
new(
window.AudioContext ||
window.webkitAudioContext
)();

musicGain =
audioContext.createGain();

ambientGain =
audioContext.createGain();

effectGain =
audioContext.createGain();


musicGain.gain.value =
.35;

ambientGain.gain.value =
.10;

effectGain.gain.value =
.35;


musicGain.connect(
audioContext.destination
);

ambientGain.connect(
audioContext.destination
);

effectGain.connect(
audioContext.destination
);


startMusic();

startBirds();

}


/* =========================
   MÚSICA
========================= */

function startMusic(){

if(musicStarted)
return;

musicStarted = true;


const notes = [

261.63,
329.63,
392,
329.63,
293.66,
349.23,
440,
349.23

];


let i = 0;


function note(){

if(!audioContext)
return;


const osc =
audioContext.createOscillator();

const gain =
audioContext.createGain();


osc.type =
"sine";

osc.frequency.value =
notes[i];


gain.gain.setValueAtTime(
0,
audioContext.currentTime
);


gain.gain.linearRampToValueAtTime(
.055,
audioContext.currentTime + .08
);


gain.gain.linearRampToValueAtTime(
0,
audioContext.currentTime + 1.4
);


osc.connect(gain);

gain.connect(musicGain);

osc.start();

osc.stop(
audioContext.currentTime + 1.5
);


i =
(i + 1) %
notes.length;


setTimeout(
note,
1100
);

}


note();

}


/* =========================
   PASSARINHOS
========================= */

function startBirds(){

function bird(){

if(!audioContext)
return;


const osc =
audioContext.createOscillator();

const gain =
audioContext.createGain();

const now =
audioContext.currentTime;


osc.type =
"sine";


osc.frequency.setValueAtTime(
1200,
now
);


osc.frequency.linearRampToValueAtTime(
1800,
now + .12
);


osc.frequency.linearRampToValueAtTime(
1300,
now + .24
);


gain.gain.setValueAtTime(
0,
now
);


gain.gain.linearRampToValueAtTime(
.025,
now + .03
);


gain.gain.linearRampToValueAtTime(
0,
now + .27
);


osc.connect(gain);

gain.connect(
ambientGain
);


osc.start(now);

osc.stop(
now + .3
);


setTimeout(
bird,
7000 +
Math.random() * 7000
);

}


bird();

}


/* =========================
   CONTROLES DE SOM
========================= */

document
.getElementById("soundButton")
.onclick =
function(event){

event.stopPropagation();

const panel =
document.getElementById(
"audioPanel"
);

panel.style.display =
panel.style.display === "block"
? "none"
: "block";

};


document
.getElementById("musicVolume")
.addEventListener(
"input",
function(){

if(musicGain)
musicGain.gain.value =
muted
? 0
: this.value;

}
);


document
.getElementById("ambientVolume")
.addEventListener(
"input",
function(){

if(ambientGain)
ambientGain.gain.value =
muted
? 0
: this.value;

}
);


document
.getElementById("effectVolume")
.addEventListener(
"input",
function(){

if(effectGain)
effectGain.gain.value =
muted
? 0
: this.value;

}
);


document
.getElementById("muteButton")
.onclick =
function(){

muted =
!muted;


if(musicGain)
musicGain.gain.value =
muted
? 0
: document.getElementById(
"musicVolume"
).value;


if(ambientGain)
ambientGain.gain.value =
muted
? 0
: document.getElementById(
"ambientVolume"
).value;


if(effectGain)
effectGain.gain.value =
muted
? 0
: document.getElementById(
"effectVolume"
).value;


this.textContent =
muted
? "Ativar som"
: "Silenciar";

};


/* =========================
   HISTÓRIA
========================= */

const story = {


start:{

type:"narration",

text:
"O portão da Universidade Aurora surge diante de você. O lugar parece ainda maior do que nas fotos.",

next:"arrival"

},


arrival:{

type:"narration",

text:
"O vento suave movimenta as árvores enquanto estudantes atravessam o campus. É o começo de uma nova fase da sua vida.",

next:"thoughts"

},


thoughts:{

type:"dialogue",

speaker:"Você",

text:
"Então... é aqui que tudo vai começar.",

next:"stranger"

},


stranger:{

type:"dialogue",

speaker:"???",

text:
"Primeiro dia?",

next:"stranger2"

},


stranger2:{

type:"dialogue",

speaker:"Você",

text:
"Ah... sim.",

next:"stranger3"

},


stranger3:{

type:"dialogue",

speaker:"???",

text:
"Dá para perceber. Você está olhando para o prédio como se estivesse tentando decorar cada janela.",

next:"choiceFirst"

},


/* PRIMEIRA ESCOLHA */

choiceFirst:{

type:"choice",

text:
"O que você faz?",

choices:[

{

text:
"Converso com ele.",

action:function(){

memory.conversouComEstranho =
true;

memory.affinity += 2;

setChilde(
"sorrindo"
);

showNode(
"talked"
);

}

},


{

text:
"Observo a universidade antes de responder.",

action:function(){

memory.observouUniversidade =
true;

setChilde(
"franzindo"
);

showNode(
"observed"
);

}

},


{

text:
"Sorrio e entro imediatamente.",

action:function(){

memory.entrouImediatamente =
true;

setChilde(
"decepcionado"
);

showNode(
"entered"
);

}

}

]

},


/* CAMINHO 1 */

talked:{

type:"dialogue",

speaker:"Você",

text:
"Talvez eu esteja um pouco perdida.",

next:"talked2"

},


talked2:{

type:"dialogue",

speaker:"???",

text:
"Normal. Eu também estava no meu primeiro dia.",

next:"talked3"

},


talked3:{

type:"dialogue",

speaker:"???",

text:
"Aliás... acho que ainda não perguntei seu nome.",

next:"choiceName"

},


choiceName:{

type:"choice",

text:
"Você responde:",

choices:[

{

text:
"Digo meu nome.",

action:function(){

memory.perguntouNome =
true;

memory.affinity += 2;

setChilde(
"sorrindo"
);

showNode(
"gaveName"
);

}

},


{

text:
"Brinco e digo que é segredo.",

action:function(){

memory.perguntouNome =
false;

memory.affinity += 1;

setChilde(
"sorrindo"
);

showNode(
"secretName"
);

}

}

]

},


gaveName:{

type:"dialogue",

speaker:"???",

text:
"Bonito nome.",

next:"afterName"

},


afterName:{

type:"narration",

text:
"Por algum motivo, aquela simples frase fica na sua cabeça enquanto você entra no campus.",

next:"childeMeeting"

},

/* =========================
   MOSTRAR NÓ
========================= */

let currentNode =
null;

let locked =
false;


function showNode(id){

const node =
story[id];

if(!node)
return;


currentNode =
node;

choiceArea.innerHTML =
"";

tapIndicator.style.display =
"none";

dialogueBox.style.cursor =
"default";


/* NARRAÇÃO */

if(
node.type === "narration"
){

dialogueSpeaker.textContent =
"";

dialogueText.textContent =
node.text;

tapIndicator.style.display =
"block";

dialogueBox.style.cursor =
"pointer";

return;

}


/* DIÁLOGO */

if(
node.type === "dialogue"
){

dialogueSpeaker.textContent =
node.speaker || "";

dialogueText.textContent =
node.text;

tapIndicator.style.display =
"block";

dialogueBox.style.cursor =
"pointer";

return;

}


/* ESCOLHA */

if(
node.type === "choice"
){

dialogueSpeaker.textContent =
"";

dialogueText.textContent =
node.text;


node.choices.forEach(
function(choice){

const button =
document.createElement(
"button"
);

button.className =
"choice-button";

button.textContent =
choice.text;


button.addEventListener(
"click",
function(){

if(locked)
return;

locked =
true;

choice.action();

updateAffinity();


setTimeout(
function(){

locked =
false;

},
120
);

}
);


choiceArea.appendChild(
button
);

}
);

return;

}


/* CONDICIONAL */

if(
node.type === "conditional"
){

showNode(
node.condition()
);

return;

}


/* FINAL */

if(
node.type === "end"
){

dialogueSpeaker.textContent =
"";

dialogueText.textContent =
node.text;


const button =
document.createElement(
"button"
);

button.className =
"restart-button";

button.textContent =
"Recomeçar";


button.addEventListener(
"click",
resetStory
);


choiceArea.appendChild(
button
);

}

}


/* =========================
   TOQUE NA CAIXA
========================= */

dialogueBox.addEventListener(
"click",
function(){

if(!currentNode)
return;


if(
currentNode.type === "narration" ||
currentNode.type === "dialogue"
){

if(
currentNode.next
){

showNode(
currentNode.next
);

}

}

}
);


/* =========================
   AFINIDADE
========================= */

function updateAffinity(){

affinityDisplay.textContent =
"♡ Afinidade " +
memory.affinity;

}


/* =========================
   RECOMEÇAR
========================= */

function resetStory(){

memory.conversouComEstranho =
false;

memory.observouUniversidade =
false;

memory.entrouImediatamente =
false;

memory.perguntouNome =
false;

memory.seguiuSozinhaDepois =
false;

memory.affinity =
0;

memory.childeExpression =
"franzindo";


hideChilde();

sceneImage.src =
"universidade-aurora.png.PNG";

updateAffinity();

showNode(
"start"
);

}


/* =========================
   COMEÇAR
========================= */

startButton.addEventListener(
"click",
function(){

startScreen.style.display =
"none";

storyScreen.style.display =
"block";

initAudio();

showNode(
"start"
);

}
);

updateAffinity();

</script>
