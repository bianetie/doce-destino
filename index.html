<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Doce Destino</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #130d18;
  color: white;

  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}


/* =====================================================
   JOGO
===================================================== */

.game {
  position: relative;

  width: 100%;
  height: 100dvh;

  overflow: hidden;
}


/* =====================================================
   TELA INICIAL
===================================================== */

.start-screen {
  position: absolute;
  inset: 0;

  z-index: 100;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;

  text-align: center;

  background:
    radial-gradient(
      circle at center,
      #815677,
      #211322 70%,
      #110b16
    );
}

.start-screen.hidden {
  display: none;
}

.start-title {
  margin: 0;

  font-size:
    clamp(38px, 10vw, 58px);

  font-weight: normal;

  letter-spacing: 1px;

  color: #fff4fb;

  text-shadow:
    0 2px 10px rgba(0,0,0,.35);
}

.start-subtitle {
  margin:
    10px 0 32px;

  font-size: 16px;

  color: #f6dbe9;

  font-style: italic;
}

.name-input {
  width: min(310px, 88vw);

  padding:
    14px 18px;

  border:
    1px solid rgba(255,255,255,.4);

  border-radius: 16px;

  outline: none;

  background:
    rgba(30,16,34,.72);

  color: white;

  text-align: center;

  font-size: 16px;
}

.name-input::placeholder {
  color:
    rgba(255,255,255,.65);
}

.start-button {
  width: min(310px, 88vw);

  margin-top: 14px;

  padding:
    14px 20px;

  border:
    1px solid rgba(255,255,255,.32);

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #a86598,
      #814d79
    );

  color: white;

  font-size: 17px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.25);
}

.start-button:active {
  transform: scale(.98);
}


/* =====================================================
   HISTÓRIA
===================================================== */

.story-screen {
  position: absolute;
  inset: 0;

  display: none;

  overflow: hidden;

  background: #140d19;
}

.story-screen.active {
  display: block;
}


/* =====================================================
   CENÁRIO
===================================================== */

.scene {
  position: absolute;
  inset: 0;

  overflow: hidden;

  background: #151020;
}

.scene img {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 115%;
  height: 115%;

  max-width: none;

  object-fit: cover;

  transform-origin: center;

  animation:
    auroraCamera 22s ease-in-out infinite alternate;
}

@keyframes auroraCamera {

  0% {
    transform:
      translate(-50%, -50%)
      scale(1.02)
      translate3d(-.4%, 0, 0);
  }

  50% {
    transform:
      translate(-50%, -50%)
      scale(1.06)
      translate3d(.4%, -.3%, 0);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1.09)
      translate3d(-.3%, .4%, 0);
  }
}

.scene::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(15,7,20,.10),
      transparent 35%,
      rgba(12,5,18,.58) 100%
    );
}


/* =====================================================
   PÉTALAS
===================================================== */

.wind-layer {
  position: absolute;
  inset: 0;

  z-index: 5;

  overflow: hidden;

  pointer-events: none;
}

.leaf {
  position: absolute;

  width: 12px;
  height: 7px;

  border-radius:
    100% 0 100% 0;

  background:
    rgba(255,196,220,.86);

  animation:
    windLeaf linear infinite;

  opacity: 0;
}

.leaf:nth-child(1) {
  left: 5%;
  top: 17%;
  animation-duration: 7s;
  animation-delay: -2s;
}

.leaf:nth-child(2) {
  left: 20%;
  top: 25%;
  animation-duration: 9s;
  animation-delay: -5s;
}

.leaf:nth-child(3) {
  left: 35%;
  top: 12%;
  animation-duration: 8s;
  animation-delay: -1s;
}

.leaf:nth-child(4) {
  left: 52%;
  top: 22%;
  animation-duration: 10s;
  animation-delay: -6s;
}

.leaf:nth-child(5) {
  left: 68%;
  top: 15%;
  animation-duration: 8s;
  animation-delay: -3s;
}

.leaf:nth-child(6) {
  left: 84%;
  top: 28%;
  animation-duration: 11s;
  animation-delay: -7s;
}

.leaf:nth-child(7) {
  left: 12%;
  top: 40%;
  animation-duration: 9s;
  animation-delay: -4s;
}

.leaf:nth-child(8) {
  left: 60%;
  top: 38%;
  animation-duration: 8s;
  animation-delay: -6s;
}

@keyframes windLeaf {

  0% {
    transform:
      translate3d(-20px,-10px,0)
      rotate(0);

    opacity: 0;
  }

  12% {
    opacity: .9;
  }

  45% {
    transform:
      translate3d(150px,65px,0)
      rotate(170deg);
  }

  75% {
    transform:
      translate3d(280px,30px,0)
      rotate(300deg);
  }

  100% {
    transform:
      translate3d(420px,140px,0)
      rotate(430deg);

    opacity: 0;
  }
}


/* =====================================================
   ÁGUA
===================================================== */

.water-effect {
  position: absolute;

  left: 50%;
  top: 76%;

  width: 190px;
  height: 60px;

  transform:
    translate(-50%, -50%);

  z-index: 6;

  pointer-events: none;
}

.ripple {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 25px;
  height: 8px;

  transform:
    translate(-50%, -50%);

  border:
    1.5px solid rgba(255,255,255,.45);

  border-radius: 50%;

  animation:
    rippleWater 3.2s ease-out infinite;
}

.ripple:nth-child(2) {
  animation-delay: 1.05s;
}

.ripple:nth-child(3) {
  animation-delay: 2.1s;
}

@keyframes rippleWater {

  0% {
    width: 25px;
    height: 8px;
    opacity: .65;
  }

  100% {
    width: 165px;
    height: 42px;
    opacity: 0;
  }
}

.water-shimmer {
  position: absolute;

  left: 50%;
  top: 73%;

  width: 130px;
  height: 4px;

  transform:
    translateX(-50%);

  z-index: 7;

  pointer-events: none;

  background:
    rgba(255,255,255,.32);

  filter: blur(3px);

  animation:
    waterShimmer 2.5s ease-in-out infinite;
}

@keyframes waterShimmer {

  0%,
  100% {
    transform:
      translateX(-65%)
      scaleX(.55);

    opacity: .15;
  }

  50% {
    transform:
      translateX(-35%)
      scaleX(1.1);

    opacity: .55;
  }
}


/* =====================================================
   HUD
===================================================== */

.hud {
  position: absolute;

  top: 17px;
  left: 18px;
  right: 18px;

  z-index: 20;

  display: flex;

  align-items: center;
  justify-content: space-between;
}

.player-info {
  display: flex;

  align-items: center;

  gap: 9px;
}

.player-avatar {
  width: 58px;
  height: 58px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border:
    1px solid rgba(255,255,255,.65);

  background:
    linear-gradient(
      145deg,
      rgba(190,110,170,.92),
      rgba(119,63,113,.92)
    );

  color: white;

  font-size: 27px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.28);
}

.player-name {
  font-size: 22px;

  font-weight: normal;

  text-shadow:
    0 2px 6px rgba(0,0,0,.75);
}

.affinity {
  display: flex;

  align-items: center;

  gap: 6px;

  padding:
    9px 13px;

  border-radius: 20px;

  background:
    rgba(40,21,45,.72);

  border:
    1px solid rgba(255,255,255,.2);

  font-size: 16px;
}

.affinity-heart {
  font-size: 19px;
}


/* =====================================================
   ÁREA DE DIÁLOGO
===================================================== */

.bottom-area {
  position: absolute;

  left: 18px;
  right: 18px;
  bottom: 16px;

  z-index: 20;
}

.dialogue-box {
  padding:
    17px 19px;

  border-radius: 20px;

  background:
    rgba(19,10,25,.87);

  border:
    1px solid rgba(255,255,255,.19);

  box-shadow:
    0 6px 20px rgba(0,0,0,.28);

  backdrop-filter:
    blur(4px);

  -webkit-backdrop-filter:
    blur(4px);
}

.dialogue-text {
  margin: 0;

  font-size:
    clamp(15px, 3.9vw, 18px);

  line-height: 1.42;

  color: #fffafa;

  font-weight: normal;
}


/* =====================================================
   BOTÃO CONTINUAR
===================================================== */

.continue-area {
  display: flex;

  justify-content: flex-end;

  margin-top: 9px;
}

.continue-button {
  padding:
    10px 18px;

  border:
    1px solid rgba(255,255,255,.3);

  border-radius: 15px;

  background:
    rgba(116,61,107,.88);

  color: #fff;

  font-size: 14px;

  font-weight: normal;

  box-shadow:
    0 3px 10px rgba(0,0,0,.2);
}

.continue-button::after {
  content: "  ›";
}


/* =====================================================
   ESCOLHAS
===================================================== */

.choices {
  display: flex;

  flex-direction: column;

  gap: 8px;

  margin-top: 9px;
}

.choice-button {
  width: 100%;

  padding:
    12px 17px;

  border-radius: 15px;

  border:
    1px solid rgba(255,255,255,.28);

  background:
    linear-gradient(
      135deg,
      rgba(148,78,132,.88),
      rgba(103,55,96,.92)
    );

  color: #fff;

  text-align: left;

  font-size:
    clamp(14px, 3.7vw, 17px);

  font-weight: normal;

  box-shadow:
    0 3px 12px rgba(0,0,0,.22);

  transition:
    transform .15s ease,
    background .15s ease;
}

.choice-button::before {
  content: "❀ ";

  opacity: .75;

  font-size: 12px;
}

.choice-button:active {
  transform: scale(.985);
}


/* =====================================================
   SOM
===================================================== */

.sound-button {
  position: absolute;

  right: 18px;
  bottom: 180px;

  z-index: 40;

  width: 43px;
  height: 43px;

  border-radius: 50%;

  border:
    1px solid rgba(255,255,255,.3);

  background:
    rgba(28,17,35,.72);

  color: white;

  font-size: 19px;
}

.audio-panel {
  position: absolute;

  right: 18px;
  bottom: 230px;

  z-index: 50;

  width: 215px;

  padding: 16px;

  border-radius: 20px;

  border:
    1px solid rgba(255,255,255,.25);

  background:
    rgba(31,17,36,.94);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

  display: none;
}

.audio-panel.open {
  display: block;
}

.audio-title {
  margin:
    0 0 13px;

  font-size: 17px;

  font-weight: normal;

  color: #f8dfeb;
}

.volume-row {
  margin-bottom: 13px;
}

.volume-label {
  display: flex;

  justify-content: space-between;

  margin-bottom: 5px;

  font-size: 13px;

  color: #f2dce8;
}

.volume-value {
  opacity: .7;
}

.volume-slider {
  width: 100%;

  accent-color: #c27bad;
}

.mute-button {
  width: 100%;

  padding: 9px;

  border-radius: 12px;

  border:
    1px solid rgba(255,255,255,.2);

  background:
    rgba(133,70,119,.7);

  color: white;

  font-size: 14px;
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-height: 700px) {

  .hud {
    top: 9px;
  }

  .player-avatar {
    width: 51px;
    height: 51px;
    font-size: 24px;
  }

  .player-name {
    font-size: 20px;
  }

  .affinity {
    padding:
      7px 10px;
  }

  .bottom-area {
    bottom: 9px;
  }

  .dialogue-box {
    padding:
      14px 16px;
  }

  .dialogue-text {
    font-size: 15px;
  }

  .choice-button {
    padding:
      10px 14px;

    font-size: 14px;
  }

  .sound-button {
    bottom: 166px;
  }

  .audio-panel {
    bottom: 215px;
  }
}

</style>
</head>


<body>

<div class="game">


<!-- ===================================================
     TELA INICIAL
=================================================== -->

<section
  id="startScreen"
  class="start-screen"
>

  <h1 class="start-title">
    Doce Destino
  </h1>

  <p class="start-subtitle">
    Seu coração escolhe o caminho.
  </p>

  <input
    id="nameInput"
    class="name-input"
    type="text"
    maxlength="20"
    placeholder="Digite seu nome..."
    autocomplete="off"
  >

  <button
    id="startButton"
    class="start-button"
    type="button"
  >
    Começar minha história ♡
  </button>

</section>


<!-- ===================================================
     HISTÓRIA
=================================================== -->

<section
  id="storyScreen"
  class="story-screen"
>


<!-- CENÁRIO -->

<div class="scene">

  <img
    src="universidade-aurora.png.PNG"
    alt="Universidade Aurora"
  >

  <div class="wind-layer">

    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>

  </div>


  <div class="water-effect">

    <span class="ripple"></span>
    <span class="ripple"></span>
    <span class="ripple"></span>

  </div>

  <div class="water-shimmer"></div>

</div>


<!-- HUD -->

<div class="hud">

  <div class="player-info">

    <div
      id="playerAvatar"
      class="player-avatar"
    >
      ♡
    </div>

    <div
      id="playerName"
      class="player-name"
    >
      Bia
    </div>

  </div>


  <div class="affinity">

    <span class="affinity-heart">
      ❤️
    </span>

    <span id="affinityValue">
      0
    </span>

  </div>

</div>


<!-- SOM -->

<button
  id="soundButton"
  class="sound-button"
  type="button"
  aria-label="Abrir configurações de som"
>
  ♫
</button>


<div
  id="audioPanel"
  class="audio-panel"
>

  <p class="audio-title">
    ♡ Som do ambiente
  </p>


  <div class="volume-row">

    <div class="volume-label">

      <span>🎵 Música</span>

      <span
        id="musicValue"
        class="volume-value"
      >
        35%
      </span>

    </div>

    <input
      id="musicSlider"
      class="volume-slider"
      type="range"
      min="0"
      max="100"
      value="35"
    >

  </div>


  <div class="volume-row">

    <div class="volume-label">

      <span>🐦 Ambiente</span>

      <span
        id="ambienceValue"
        class="volume-value"
      >
        10%
      </span>

    </div>

    <input
      id="ambienceSlider"
      class="volume-slider"
      type="range"
      min="0"
      max="100"
      value="10"
    >

  </div>


  <div class="volume-row">

    <div class="volume-label">

      <span>✨ Efeitos</span>

      <span
        id="effectsValue"
        class="volume-value"
      >
        35%
      </span>

    </div>

    <input
      id="effectsSlider"
      class="volume-slider"
      type="range"
      min="0"
      max="100"
      value="35"
    >

  </div>


  <button
    id="muteButton"
    class="mute-button"
    type="button"
  >
    🔇 Silenciar tudo
  </button>

</div>


<!-- ===================================================
     DIÁLOGO
=================================================== -->

<div class="bottom-area">

  <div class="dialogue-box">

    <p
      id="dialogueText"
      class="dialogue-text"
    ></p>

  </div>


  <div
    id="continueArea"
    class="continue-area"
  ></div>


  <div
    id="choices"
    class="choices"
  ></div>

</div>


</section>

</div>


<script>

/* =====================================================
   ESTADO DO JOGO
===================================================== */

let playerName = "Bia";

let affinity = 0;

let currentNode = "intro_01";


/*
   🦋 MEMÓRIA DA HISTÓRIA

   Tudo que o jogador fizer pode ser guardado aqui.
*/

const memory = {

  conversouComEstranho: false,

  foiSozinha: false,

  observouUniversidade: false,

  entrouImediatamente: false

};


/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
  document.getElementById("startScreen");

const storyScreen =
  document.getElementById("storyScreen");

const nameInput =
  document.getElementById("nameInput");

const startButton =
  document.getElementById("startButton");

const playerNameElement =
  document.getElementById("playerName");

const affinityElement =
  document.getElementById("affinityValue");

const dialogueText =
  document.getElementById("dialogueText");

const choicesElement =
  document.getElementById("choices");

const continueArea =
  document.getElementById("continueArea");

const soundButton =
  document.getElementById("soundButton");

const audioPanel =
  document.getElementById("audioPanel");

const musicSlider =
  document.getElementById("musicSlider");

const ambienceSlider =
  document.getElementById("ambienceSlider");

const effectsSlider =
  document.getElementById("effectsSlider");

const musicValue =
  document.getElementById("musicValue");

const ambienceValue =
  document.getElementById("ambienceValue");

const effectsValue =
  document.getElementById("effectsValue");

const muteButton =
  document.getElementById("muteButton");


/* =====================================================
   HISTÓRIA

   "dialogue" = conversa normal
   "narration" = narrativa
   "choice" = decisão importante
===================================================== */

const story = {


  /* ===================================================
     COMEÇO
  =================================================== */

  intro_01: {

    type: "narration",

    text:
      "O portão da Universidade Aurora se ergue diante de você. É seu primeiro dia, e por alguns segundos você simplesmente observa o lugar.",

    next: "intro_02"

  },


  intro_02: {

    type: "narration",

    text:
      "Uma brisa atravessa as árvores. Algumas pétalas passam diante dos seus olhos enquanto o som distante da fonte se mistura ao movimento dos estudantes.",

    next: "intro_03"

  },


  intro_03: {

    type: "dialogue",

    speaker: "",

    text:
      "Você respira fundo. Uma nova cidade, uma nova universidade... e uma vida inteira que ainda não sabe como vai ser.",

    next: "intro_04"

  },


  intro_04: {

    type: "dialogue",

    speaker: "",

    text:
      "— Primeiro dia?",

    next: "intro_05"

  },


  intro_05: {

    type: "dialogue",

    speaker: "???",

    text:
      "Você olha para o lado. Um estudante está parado alguns passos atrás, segurando alguns livros.",

    next: "intro_06"

  },


  intro_06: {

    type: "dialogue",

    speaker: "???",

    text:
      "— Dá para perceber?",

    next: "intro_choice"

  },


  /* ===================================================
     PRIMEIRA ESCOLHA IMPORTANTE
  =================================================== */

  intro_choice: {

    type: "choice",

    text:
      "Como você responde?",

    choices: [

      {

        text:
          "Sorrir e continuar conversando.",

        affinity:
          2,

        consequence:
          "conversouComEstranho",

        next:
          "talk_01"

      },

      {

        text:
          "Agradecer e seguir sozinha.",

        affinity:
          0,

        consequence:
          "foiSozinha",

        next:
          "alone_01"

      }

    ]

  },


  /* ===================================================
     CAMINHO: CONVERSOU
  =================================================== */

  talk_01: {

    type: "dialogue",

    speaker: "???",

    text:
      "— Um pouco. Mas não se preocupe. Eu também demorei para descobrir onde ficavam as coisas quando cheguei.",

    next: "talk_02"

  },


  talk_02: {

    type: "dialogue",

    speaker: "",

    text:
      "Ele sorri de maneira tranquila. Por algum motivo, a tensão do seu primeiro dia diminui um pouco.",

    next: "talk_03"

  },


  talk_03: {

    type: "dialogue",

    speaker: "???",

    text:
      "— Se estiver procurando o prédio principal, é por ali.",

    next: "talk_04"

  },


  talk_04: {

    type: "dialogue",

    speaker: "",

    text:
      "Você olha na direção que ele aponta. O caminho parece muito mais simples agora.",

    next: "talk_choice"

  },


  /* ===================================================
     SEGUNDA ESCOLHA
  =================================================== */

  talk_choice: {

    type: "choice",

    text:
      "O que você faz?",

    choices: [

      {

        text:
          "Perguntar o nome dele.",

        affinity:
          2,

        consequence:
          "perguntouNome",

        next:
          "name_01"

      },

      {

        text:
          "Agradecer e ir para o prédio.",

        affinity:
          1,

        consequence:
          "seguiuSozinhaDepois",

        next:
          "name_02"

      }

    ]

  },


  name_01: {

    type: "dialogue",

/* =====================================================
   MOSTRAR NÓ
===================================================== */

function showNode(nodeId) {

  currentNode =
    nodeId;

  const node =
    story[nodeId];


  dialogueText.textContent =
    "";


  continueArea.innerHTML =
    "";


  choicesElement.innerHTML =
    "";


  if (!node) {
    return;
  }


  /* ==============================================
     CONDICIONAL
  ============================================== */

  if (node.type === "conditional") {

    const nextNode =
      node.next();

    showNode(nextNode);

    return;

  }


  /* ==============================================
     TEXTO
  ============================================== */

  if (node.text) {

    let text =
      node.text.replace(
        "{name}",
        playerName
      );

    dialogueText.textContent =
      text;

  }


  /* ==============================================
     FALA DE PERSONAGEM
  ============================================== */

  if (
    node.speaker &&
    node.speaker !== ""
  ) {

    dialogueText.textContent =
      node.speaker +
      " — " +
      dialogueText.textContent;

  }


  /* ==============================================
     NARRAÇÃO / DIÁLOGO
  ============================================== */

  if (
    node.type === "narration" ||
    node.type === "dialogue"
  ) {

    const button =
      document.createElement("button");

    button.type =
      "button";

    button.className =
      "continue-button";

    button.textContent =
      "Continuar";


    button.addEventListener(
      "click",
      () => {

        if (node.next) {

          showNode(
            node.next
          );

        }

      }
    );


    continueArea.appendChild(
      button
    );

    return;

  }


  /* ==============================================
     ESCOLHA
  ============================================== */

  if (node.type === "choice") {

    node.choices.forEach(
      choice => {

        const button =
          document.createElement("button");

        button.type =
          "button";

        button.className =
          "choice-button";

        button.textContent =
          choice.text;


        button.addEventListener(
          "click",
          () => {

            /* Afinidade */

            affinity +=
              choice.affinity || 0;


            affinityElement.textContent =
              affinity;


            /* 🦋 Memória */

            if (
              choice.consequence
            ) {

              memory[
                choice.consequence
              ] = true;

            }


            /* Próximo acontecimento */

            showNode(
              choice.next
            );

          }
        );


        choicesElement.appendChild(
          button
        );

      }
    );

  }


  /* ==============================================
     FINAL
  ============================================== */

  if (node.type === "end") {

    const button =
      document.createElement("button");

    button.type =
      "button";

    button.className =
      "continue-button";

    button.textContent =
      "Voltar ao início";


    button.addEventListener(
      "click",
      () => {

        resetStory();

      }
    );


    continueArea.appendChild(
      button
    );

  }

}


/* =====================================================
   RESETAR HISTÓRIA
===================================================== */

function resetStory() {

  affinity = 0;

  currentNode =
    "intro_01";


  memory.conversouComEstranho =
    false;

  memory.foiSozinha =
    false;

  memory.observouUniversidade =
    false;

  memory.entrouImediatamente =
    false;

  memory.perguntouNome =
    false;

  memory.seguiuSozinhaDepois =
    false;


  affinityElement.textContent =
    "0";


  showNode(
    "intro_01"
  );

}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

let musicGain = null;

let ambienceGain = null;

let effectsGain = null;

let musicTimer = null;

let birdTimer = null;

let soundEnabled = true;

let musicVolume = .35;

let ambienceVolume = .10;

let effectsVolume = .35;


function createAudio() {

  if (audioContext) {
    return;
  }


  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    musicGain =
      audioContext.createGain();

    ambienceGain =
      audioContext.createGain();

    effectsGain =
      audioContext.createGain();


    musicGain.gain.value =
      musicVolume;

    ambienceGain.gain.value =
      ambienceVolume;

    effectsGain.gain.value =
      effectsVolume;


    musicGain.connect(
      audioContext.destination
    );

    ambienceGain.connect(
      audioContext.destination
    );

    effectsGain.connect(
      audioContext.destination
    );


    startMusic();

    startBirds();

  } catch (error) {

    console.log(
      "Áudio indisponível",
      error
    );

  }

}


/* =====================================================
   MÚSICA
===================================================== */

const melody = [

  261.63,
  329.63,
  392.00,
  523.25,

  392.00,
  329.63,
  293.66,
  261.63,

  293.66,
  349.23,
  440.00,
  523.25,

  440.00,
  349.23,
  329.63,
  293.66

];

let melodyIndex = 0;


function playMusicNote(
  frequency,
  duration
) {

  if (
    !audioContext ||
    !musicGain ||
    !soundEnabled
  ) {
    return;
  }


  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type =
    "sine";

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0,
    audioContext.currentTime
  );

  gain.gain.linearRampToValueAtTime(
    .07,
    audioContext.currentTime + .08
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime + duration
  );


  oscillator.connect(gain);

  gain.connect(
    musicGain
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}


function startMusic() {

  if (musicTimer) {
    return;
  }


  musicTimer =
    setInterval(
      () => {

        if (!soundEnabled) {
          return;
        }


        playMusicNote(
          melody[melodyIndex],
          1.6
        );


        melodyIndex =
          (melodyIndex + 1)
          % melody.length;

      },
      900
    );

}


/* =====================================================
   PÁSSARO
===================================================== */

function playBird() {

  if (
    !audioContext ||
    !ambienceGain ||
    !soundEnabled
  ) {
    return;
  }


  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  const now =
    audioContext.currentTime;


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    1750,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    2200,
    now + .13
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    1650,
    now + .27
  );


  gain.gain.setValueAtTime(
    0,
    now
  );

  gain.gain.linearRampToValueAtTime(
    .045,
    now + .03
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now + .32
  );


  oscillator.connect(gain);

  gain.connect(
    ambienceGain
  );


  oscillator.start(now);

  oscillator.stop(
    now + .35
  );

}


function startBirds() {

  if (birdTimer) {
    return;
  }


  birdTimer =
    setInterval(
      () => {

        if (
          soundEnabled &&
          Math.random() > .4
        ) {

          playBird();

        }

      },
      6500
    );

}


/* =====================================================

startButton.addEventListener(

    const typedName =

    startScreen.classList.add(

    storyScreen.classList.add(

      audioContext &&

    }

  }
);

/* =====================================================
   SILENCIAR
===================================================== */

muteButton.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;


    if (musicGain) {

      musicGain.gain.value =
        soundEnabled
          ? musicVolume
          : 0;

    }


    if (ambienceGain) {

      ambienceGain.gain.value =
        soundEnabled
          ? ambienceVolume
          : 0;

    }


    if (effectsGain) {

      effectsGain.gain.value =
        soundEnabled
          ? effectsVolume
          : 0;

    }


    muteButton.textContent =
      soundEnabled
        ? "🔇 Silenciar tudo"
        : "🔊 Ativar sons";

  }
);
